<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容配置 - 智能问数管理后台</title>
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="../../assets/css/knowledge-skill.css">
  <link rel="stylesheet" href="../../assets/css/sql-editor.css">
  <link rel="stylesheet" href="../../assets/css/skill-workflow.css?v=20260916-skill-actions">
</head>
<body>
  <div class="admin-shell sw-content-shell">
    <aside class="admin-sidebar"><div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div><nav class="admin-menu"></nav></aside>
    <main class="admin-main">
      <header class="admin-topbar sw-single-header"><h1 id="swSkillName">内容配置</h1><a href="knowledge-skill.html" class="ghost-btn sw-button" id="swBack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>返回</a></header>
      <section class="admin-content sw-content">
        <div class="sw-workbench" id="swWorkbench">
          <section class="sw-preview-panel">
            <form class="sw-preview-search" id="swSearchForm" role="search"><input type="search" id="swPartSearch" placeholder="搜索标注名称或原文，Enter 定位下一处" aria-label="搜索文档标注"><span id="swSearchStatus" role="status" aria-live="polite"></span><button type="submit" class="ghost-btn sw-button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg>搜索</button><button type="button" class="secondary-btn sw-button" id="swDrawRegion" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5M12 8v8M8 12h8"/></svg>框选新增</button></form>
            <div class="sw-draw-hint hidden" id="swDrawHint" role="status">在同一页内拖动框选遗漏内容，松开后设置新增项；按 Esc 取消。</div>
            <div class="sw-preview-body is-outline-open" id="swPreviewBody">
              <aside class="sw-outline" id="swOutline" aria-label="Word 大纲">
                <div class="sw-outline-head"><strong>大纲</strong><button type="button" class="sw-outline-close" id="swOutlineClose" aria-label="收起大纲" title="收起大纲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
                <nav class="sw-outline-tree" id="swOutlineTree" aria-label="文档标题导航"></nav>
              </aside>
              <button type="button" class="sw-outline-open hidden" id="swOutlineOpen" aria-label="展开大纲" title="展开大纲"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span>大纲</span></button>
              <div class="sw-document-scroll" id="swDocumentScroll"><div id="swDocxStyles"></div><div id="swDocument" class="sw-document"><div class="sw-empty">正在加载原模板…</div></div></div>
            </div>
            <div class="sw-preview-foot sw-mark-summary" aria-label="标注统计"><div class="sw-mark-stats"><span id="swTotalCount"></span><span id="swTypeCounts" class="sw-type-counts"></span><span id="swConfirmedCount" role="status" aria-live="polite"></span><span id="swPageInfo" class="hidden">点击标注配置对应内容</span></div><div class="sw-global-test-actions"><span id="swGlobalTestStatus" role="status" aria-live="polite"></span><button type="button" class="sw-failure-trigger sw-button hidden" id="swFailureTrigger" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L2 21h20L12 3M12 9v5M12 18h.01"/></svg><span id="swFailureTriggerText">失败 0 项</span></button><button type="button" class="secondary-btn sw-button" id="swRunAll"><svg viewBox="0 0 24 24"><path d="M8 4v16l12-8L8 4"/></svg><span id="swRunAllText">全局测试</span></button><button type="button" class="primary-btn sw-button" id="swConfirmAll" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l4 4L15 7M11 15l3 3 7-8"/></svg><span id="swConfirmAllText">全部确认</span></button></div></div>
          </section>
          <div class="sw-resize-handle" id="swResizeHandle" role="separator" aria-label="调整文档预览和配置区域宽度" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="65" aria-valuenow="57" tabindex="0"><span class="sw-resize-grip" aria-hidden="true"><svg viewBox="0 0 12 20"><path d="M4 4v12M8 4v12"/></svg></span><span class="sw-resize-value" id="swResizeValue">左右拖动调整宽度</span></div>
          <section class="sw-config-panel" aria-label="当前内容配置">
            <section class="sw-test-composer" aria-label="业务端测试提问">
              <div class="sw-test-question" id="swTestPrompt" contenteditable="true" role="textbox" aria-multiline="true" aria-label="测试提问" spellcheck="true"></div>
              <div class="sw-test-question-foot"><span>浅蓝色内容为变量，可直接修改后测试</span><span id="swTestPromptState">使用业务端预置提示词</span></div>
              <p class="sw-test-param-error hidden" id="swTestParamError" role="alert"></p>
            </section>
            <div class="sw-part-head"><div><span id="swPartType" class="sw-type"></span><h2 id="swPartTitle">请选择内容项</h2></div><span id="swPartStatus" class="sw-status"></span></div>
            <div class="sw-config-scroll" id="swConfigScroll">
              <section class="sw-config-information"><div class="sw-section-title"><h3>配置信息</h3></div><div id="swConfigFields"></div></section>
              <section class="sw-section sw-test"><div class="sw-section-title"><h3>结果预览</h3><button type="button" class="primary-btn sw-button" id="swRun"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16l12-8L8 4"/></svg><span id="swRunText">测试</span></button></div><div id="swTestStatus" class="sw-execution-trace" role="status" aria-live="polite"></div><div id="swResult" class="sw-result" aria-live="polite"><div class="sw-empty">测试后在这里预览回填结果</div></div></section>
              <section class="sw-section sw-ai"><div class="sw-section-title"><h3>AI 对话调整</h3></div><div id="swChat" class="sw-chat" role="log" aria-live="polite"></div><div class="sw-ai-compose"><textarea id="swAIInput" rows="3" maxlength="1200" placeholder="说明测试结果哪里不对，AI 将修改上方配置…" aria-label="AI 修改要求"></textarea><div><span>Ctrl + Enter 发送</span><button type="button" class="primary-btn sw-button" id="swAISend"><svg viewBox="0 0 24 24"><path d="M3 3l18 9-18 9 4-9-4-9M7 12h14"/></svg>发送</button></div></div></section>
            </div>
            <div class="sw-config-footer"><button type="button" class="secondary-btn sw-button" id="swSave"><svg viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3h2M7 3v6h10V3M7 21v-8h10v8"/></svg>保存配置</button><button type="button" class="primary-btn sw-button" id="swConfirmPart" disabled><svg viewBox="0 0 24 24"><path d="M5 12l4 4L20 5"/></svg>确认此项</button><button type="button" class="ghost-btn sw-button" id="swNext"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>下一未确认项</button><button type="button" class="sw-link sw-danger sw-button sw-delete-action" id="swDeletePart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M5 6l1 15h12l1-15M9 6V3h6v3"/></svg>删除此项</button></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/skill-template-sample.js?v=20260911"></script>
  <script src="../../assets/js/skill-workflow-store.js?v=20260916-prototype-reset"></script>
  <script src="../../assets/vendor/docx-preview/jszip.min.js"></script>
  <script src="../../assets/vendor/docx-preview/docx-preview.min.js"></script>
  <script src="../../assets/js/skill-template-io.js?v=20260914-outline"></script>
  <script src="../../assets/js/skill-workflow-ui.js?v=20260916-skill-actions"></script>
  <script src="../../assets/js/sql-editor.js"></script>
  <script src="../../assets/js/skill-workflow-content.js?v=20260916-chart-prompts"></script>
</body>
</html>
