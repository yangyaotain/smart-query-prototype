<body><div class="admin-shell"><aside class="admin-sidebar"><div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div><nav class="admin-menu"><a href="data-source.html">数据源管理</a><a href="data-model.html">数据模型管理</a><a class="active" href="knowledge.html">知识库管理</a><a href="operation.html">运营管理</a><a href="theme.html">分析主题</a><a href="users.html">用户管理</a><a href="roles.html">角色管理</a></nav></aside><main class="admin-main"><header class="admin-topbar"><strong>SQL 知识库</strong><div class="toolbar"><button class="secondary-btn" onclick="goTo('knowledge.html')">返回知识库</button><button class="primary-btn" onclick="goTo('knowledge-sql-create.html')">新增SQL</button></div></header><section class="admin-content"><div class="admin-card"><div class="admin-card-head"><h2>标准问答 SQL</h2></div><div class="admin-card-body"><p style="margin:0 0 10px;color:#374151;">问题：近6个月华东区销售额趋势如何？</p><pre style="background:#f8fbff;padding:14px;border-radius:12px;white-space:pre-wrap;">SELECT month(order_date) AS month, SUM(sales_amount) AS total_sales
FROM sales_order

GROUP BY month(order_date)
ORDER BY month(order_date);</pre></div></div></section></main></div><script src="../../assets/js/common.js?v=20260519-system-config"></script></body></html>
