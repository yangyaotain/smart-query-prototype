<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>技能管理 - 智能问数管理后台</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-skill.css?v=20260914-table-fit" />
  <link rel="stylesheet" href="../../assets/css/skill-workflow.css?v=20260914-status-link" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div>
      <nav class="admin-menu"></nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <strong>技能管理</strong>
        <div class="toolbar">
          <button class="secondary-btn icon-btn" onclick="goTo('../business/smart-query.html')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/>
              <path d="M5.6 5.6l2.1 2.1"/><path d="M16.3 16.3l2.1 2.1"/>
              <path d="M5.6 18.4l2.1-2.1"/><path d="M16.3 7.7l2.1-2.1"/>
              <circle cx="12" cy="12" r="3.4"/>
            </svg>
            智能问数
          </button>
          <button class="user-trigger" type="button">
            <div class="avatar">张</div><strong>张三</strong><span class="dropdown-arrow"></span>
          </button>
        </div>
      </header>

      <section class="admin-content ks-page">
        <div class="ks-page-head">
          <div>
            <div class="ks-title-line">
              <span class="ks-title-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/><path d="M18.5 14l1 2.5L22 17.5l-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"/></svg>
              </span>
              <div><h1>技能管理</h1><p>导入 Word 模板，逐项配置与确认指标、图表及分析内容，按原模板生成业务报告。</p></div>
            </div>
          </div>
          <button type="button" class="primary-btn ks-icon-btn" id="ksBtnNew">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            新增技能
          </button>
        </div>

        <div class="ks-list-card">
          <div class="ks-filter-bar">
            <div class="ks-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input type="text" id="ksKeyword" placeholder="搜索技能名称" />
            </div>
            <select class="ks-select" id="ksCategoryFilter" title="按技能分类筛选">
              <option value="">全部分类</option>
              <option value="经营报告">经营报告</option>
              <option value="专项分析">专项分析</option>
            </select>
            <select class="ks-select" id="ksThemeFilter" title="按适用主题筛选">
              <option value="">全部分析主题</option>
              <option value="成交与节资">成交与节资</option>
              <option value="采购方式与品类">采购方式与品类</option>
              <option value="供应商管理">供应商管理</option>
              <option value="采购效能与闲废">采购效能与闲废</option>
              <option value="销售分析">销售分析</option>
              <option value="客户分析">客户分析</option>
              <option value="库存分析">库存分析</option>
              <option value="活动分析">活动分析</option>
            </select>
            <select class="ks-select" id="ksStatusFilter" title="按状态筛选">
              <option value="">全部状态</option>
              <option value="enabled">启用</option>
              <option value="disabled">停用</option>
            </select>
            <button type="button" class="primary-btn sw-button" id="ksBtnQuery"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg>查询</button>
            <button type="button" class="ghost-btn ks-icon-btn" id="ksBtnReset">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 15a7.5 7.5 0 0 0 12.8 2.7L20 14"/><path d="M4 10l1.7-3.7A7.5 7.5 0 0 1 18.5 9"/></svg>
              重置
            </button>
          </div>

          <div class="ks-table-wrap">
            <table class="ks-table">
              <colgroup>
                <col class="ks-col-skill" />
                <col class="ks-col-category" />
                <col class="ks-col-theme" />
                <col class="ks-col-progress" />
                <col class="ks-col-status" />
                <col class="ks-col-updated" />
                <col class="ks-col-actions" />
              </colgroup>
              <thead>
                <tr>
                  <th>技能名称</th>
                  <th>分类</th>
                  <th>适用分析主题</th>
                  <th>解析与确认进度</th>
                  <th>启用状态</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="ksTableBody"></tbody>
            </table>
            <div class="ks-empty hidden" id="ksEmpty">
              <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
              <strong>暂无匹配技能</strong><p>请调整筛选条件后重试。</p>
            </div>
          </div>
          <div class="ks-list-foot"><span id="ksListCount">共 0 项技能</span><span>基本信息完整且全部内容确认后可启用；停用技能不在业务端展示。</span></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/js/common.js?v=20260717-natural-prompt"></script>
  <script src="../../assets/js/skill-template-sample.js?v=20260911"></script>
  <script src="../../assets/js/skill-workflow-store.js?v=20260914-sql-meta"></script>
  <script src="../../assets/vendor/docx-preview/jszip.min.js"></script>
  <script src="../../assets/js/skill-template-io.js?v=20260911"></script>
  <script src="../../assets/js/skill-workflow-ui.js?v=20260911"></script>
  <script src="../../assets/js/skill-workflow-list.js?v=20260914-table-fit"></script>
</body>
</html>
