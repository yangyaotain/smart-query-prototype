<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例库 - 智能问数管理后台</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-indicator.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-example.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div>
      <nav class="admin-menu"></nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <strong>示例库</strong>
        <div class="toolbar">
          <button class="secondary-btn icon-btn" onclick="goTo('../business/smart-query.html')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/>
              <path d="M5.6 5.6l2.1 2.1"/><path d="M16.3 16.3l2.1 2.1"/>
              <path d="M5.6 18.4l2.1-2.1"/><path d="M16.3 7.7l2.1-2.1"/>
              <circle cx="12" cy="12" r="3.4"/>
            </svg>
            智能问数
          </button>
          <button class="user-trigger" type="button">
            <div class="avatar">张</div><strong>张三</strong><span class="dropdown-arrow"></span>
          </button>
        </div>
      </header>

      <section class="admin-content ki-page ke-page">
        <div class="ki-layout">
          <aside class="ki-sidebar">
            <div class="ki-side-head">
              <h3>示例目录</h3>
              <button type="button" class="ki-side-add" id="keBtnNewGroup" title="新增一级目录">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              </button>
            </div>
            <div class="ki-side-search">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
              </svg>
              <input type="text" id="keTreeSearch" placeholder="搜索目录" />
            </div>
            <div class="ki-tree" id="keTree"></div>
            <div class="ki-side-tip">右键目录可新增、重命名、删除子节点。</div>
          </aside>

          <div class="ki-main">
            <div class="ki-top-bar">
              <div class="ki-bread">
                <span class="ki-bread-ico">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
                </span>
                <strong id="keBreadText">全部示例</strong>
                <span class="ki-bread-cnt" id="keBreadCount">0</span>
              </div>
              <div class="ki-top-actions">
                <button type="button" class="primary-btn" id="keBtnNewExample">
                  <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-ico"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                  新增示例
                </button>
              </div>
            </div>

            <div class="ki-list-card">
              <div class="ki-filter ke-filter">
                <div class="ki-search-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
                  </svg>
                  <input type="text" id="keNameInput" placeholder="名称" />
                </div>
                <div class="ki-search-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5h16"/><path d="M4 12h10"/><path d="M4 19h16"/>
                  </svg>
                  <input type="text" id="keDescInput" placeholder="描述" />
                </div>
                <div class="ki-search-wrap">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 12H4"/><path d="M14 6l6 6-6 6"/>
                  </svg>
                  <input type="text" id="keKeywordInput" placeholder="关键词" />
                </div>
                <select id="keTypeFilter" class="ki-select" title="按类型筛选">
                  <option value="">全部类型</option>
                  <option value="single">单表查询</option>
                  <option value="stat">统计查询</option>
                  <option value="join">联表查询</option>
                  <option value="schema">表结构</option>
                </select>
                <button type="button" class="ghost-btn" id="keBtnReset">重置</button>
              </div>
              <div class="ki-tablewrap">
                <table class="ki-table ke-table">
                  <thead>
                    <tr>
                      <th style="width:12%;">名称</th>
                      <th style="width:9%;">类型</th>
                      <th style="width:11%;">描述</th>
                      <th style="width:10%;">关键词</th>
                      <th style="width:14%;">示例问题</th>
                      <th style="width:10%;">数据源</th>
                      <th style="width:10%;">相关表</th>
                      <th style="width:16%;">对应SQL</th>
                      <th style="width:8%;">操作</th>
                    </tr>
                  </thead>
                  <tbody id="keTbody"></tbody>
                </table>
              </div>
              <div class="ki-pager" id="kePager"></div>
            </div>
          </div>
        </div>

        <div class="ki-ctxmenu hidden" id="keCtxMenu" role="menu">
          <button type="button" class="ki-ctx-item" data-act="new">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            新增子目录
          </button>
          <button type="button" class="ki-ctx-item" data-act="rename">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            重命名
          </button>
          <div class="ki-ctx-sep"></div>
          <button type="button" class="ki-ctx-item is-danger" data-act="delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
            删除目录
          </button>
        </div>
      </section>
    </main>
  </div>

  <div class="ki-drawer-mask hidden" id="keDrawerMask"></div>
  <aside class="ki-drawer hidden" id="keDrawer" aria-hidden="true">
    <div class="ki-drawer-resize" id="keDrawerResize" title="拖动调整宽度"></div>
    <header class="ki-drawer-head">
      <div class="ki-drawer-title">
        <h3 id="keDrawerTitle">示例详情</h3>
        <p id="keDrawerSubtitle">查看与编辑问数示例配置</p>
      </div>
      <div class="ki-drawer-head-actions">
        <span class="ki-mode-chip hidden" id="keModeChip">查看模式</span>
        <button type="button" class="ki-drawer-close" data-act="close" aria-label="关闭">×</button>
      </div>
    </header>
    <div class="ki-drawer-body" id="keDrawerBody"></div>
    <footer class="ki-drawer-foot" id="keDrawerFoot"></footer>
  </aside>

  <div class="modal-mask hidden" id="keConfirmMask"></div>
  <div class="modal small hidden" id="keConfirmModal" role="dialog" aria-modal="true" aria-labelledby="keConfirmTitle">
    <div class="modal-head">
      <div>
        <h3 id="keConfirmTitle">删除确认</h3>
        <p id="keConfirmSubtitle">操作不可恢复，仅作用于当前原型数据。</p>
      </div>
      <button type="button" class="close" data-act="cancel" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <p id="keConfirmMessage" style="margin:0;font-size:14px;color:#374151;line-height:1.7;">确定要删除该项吗？</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="ghost-btn" data-act="cancel">取消</button>
      <button type="button" class="primary-btn" data-act="ok" id="keConfirmOk" style="background:#ef4444;box-shadow:0 8px 20px rgba(239,68,68,.22);">确认删除</button>
    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/knowledge-example.js"></script>
</body>
</html>
