<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指标沉淀 - 智能问数管理后台</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-indicator.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-example.css" />
  <link rel="stylesheet" href="../../assets/css/operation-indicator.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div>
      <nav class="admin-menu"></nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <strong>指标沉淀</strong>
        <div class="toolbar">
          <button class="secondary-btn icon-btn" onclick="goTo('../business/smart-query.html')">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/>
              <path d="M5.6 5.6l2.1 2.1"/><path d="M16.3 16.3l2.1 2.1"/>
              <path d="M5.6 18.4l2.1-2.1"/><path d="M16.3 7.7l2.1-2.1"/>
              <circle cx="12" cy="12" r="3.4"/>
            </svg>
            智能问数
          </button>
          <button class="user-trigger" type="button">
            <div class="avatar">张</div><strong>张三</strong><span class="dropdown-arrow"></span>
          </button>
        </div>
      </header>

      <section class="admin-content oi-page">
        <div class="oi-head">
          <div>
            <h1>指标沉淀</h1>
            <p>从高频问数记录中识别可复用指标，沉淀后进入指标体系供智能问数复用。</p>
          </div>
          <div class="oi-head-meta">
            <span><strong id="oiPendingCount">0</strong> 问题列表</span>
            <span><strong id="oiProcessedCount">0</strong> 已沉淀指标</span>
          </div>
        </div>

        <div class="oi-panel">
          <div class="oi-tabs" role="tablist" aria-label="指标沉淀状态">
            <button type="button" class="oi-tab is-active" data-tab="pending" role="tab" aria-selected="true">
              问题列表 <span id="oiPendingBadge">0</span>
            </button>
            <button type="button" class="oi-tab" data-tab="processed" role="tab" aria-selected="false">
              已沉淀指标 <span id="oiProcessedBadge">0</span>
            </button>
          </div>

          <div class="oi-filter" id="oiPendingFilter">
            <div class="oi-field">
              <label>用户问题</label>
              <input id="oiPendingQuestion" type="text" placeholder="输入用户问题关键词" />
            </div>
            <div class="oi-field">
              <label>分析主题</label>
              <select id="oiPendingTheme">
                <option value="">全部主题</option>
                <option value="销售分析">销售分析</option>
                <option value="客户分析">客户分析</option>
                <option value="库存分析">库存分析</option>
                <option value="财务分析">财务分析</option>
                <option value="经营概览">经营概览</option>
              </select>
            </div>
            <div class="oi-filter-actions">
              <button type="button" class="ghost-btn" data-act="reset-filter">重置</button>
              <button type="button" class="primary-btn" data-act="search">查询</button>
            </div>
          </div>

          <div class="oi-filter hidden" id="oiProcessedFilter">
            <div class="oi-field">
              <label>用户问题</label>
              <input id="oiProcessedQuestion" type="text" placeholder="输入用户问题关键词" />
            </div>
            <div class="oi-field">
              <label>分析主题</label>
              <select id="oiProcessedTheme">
                <option value="">全部主题</option>
                <option value="销售分析">销售分析</option>
                <option value="客户分析">客户分析</option>
                <option value="库存分析">库存分析</option>
                <option value="财务分析">财务分析</option>
                <option value="经营概览">经营概览</option>
              </select>
            </div>
            <div class="oi-filter-actions">
              <button type="button" class="ghost-btn" data-act="reset-filter">重置</button>
              <button type="button" class="primary-btn" data-act="search">查询</button>
            </div>
          </div>

          <div class="oi-table-wrap">
            <table class="oi-table" id="oiTable">
              <thead id="oiThead"></thead>
              <tbody id="oiTbody"></tbody>
            </table>
          </div>
          <div class="ki-pager oi-pager" id="oiPager"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="ki-drawer-mask hidden" id="oiDrawerMask"></div>
  <aside class="ki-drawer oi-drawer hidden" id="oiDrawer" aria-hidden="true">
    <div class="ki-drawer-resize" id="oiDrawerResize" title="拖动调整宽度"></div>
    <header class="ki-drawer-head">
      <div class="ki-drawer-title">
        <h3 id="oiDrawerTitle">指标沉淀处理</h3>
        <p id="oiDrawerSubtitle">将高频问题沉淀为可复用指标</p>
      </div>
      <div class="ki-drawer-head-actions">
        <span class="ki-mode-chip" id="oiDrawerChip">处理模式</span>
        <button type="button" class="ki-drawer-close" data-act="close-drawer" aria-label="关闭">×</button>
      </div>
    </header>
    <div class="ki-drawer-body" id="oiDrawerBody"></div>
    <footer class="ki-drawer-foot" id="oiDrawerFoot"></footer>
  </aside>

  <script src="../../assets/js/common.js?v=20260519-system-config"></script>
  <script src="../../assets/js/operation-indicator.js"></script>
</body>
</html>
