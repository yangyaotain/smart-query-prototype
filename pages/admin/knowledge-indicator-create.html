<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新增指标 - 智能问数管理后台</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <link rel="stylesheet" href="../../assets/css/knowledge-indicator.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand"><div class="logo">管</div><span>智能问数管理后台</span></div>
      <nav class="admin-menu"></nav>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <strong>新增指标</strong>
        <div class="toolbar">
          <button class="secondary-btn" onclick="goTo('knowledge-indicator.html')">返回指标列表</button>
          <button class="primary-btn" onclick="goTo('knowledge-indicator.html')">保存指标</button>
        </div>
      </header>
      <section class="admin-content">
        <div class="admin-card">
          <div class="admin-card-head"><h2>指标定义</h2></div>
          <div class="admin-card-body">
            <div class="admin-two-col">
              <div class="field"><label>指标名称</label><input value="销售贡献率" /></div>
              <div class="field">
                <label>指标类型</label>
                <select><option>衍生指标</option><option>派生指标</option><option>原子指标</option></select>
              </div>
              <div class="field">
                <label>所属主题</label>
                <select><option>销售分析</option><option>经营概览</option></select>
              </div>
              <div class="field">
                <label>数据模型</label>
                <select><option>销售订单表</option></select>
              </div>
              <div class="field" style="grid-column:1/-1;">
                <label>计算公式</label>
                <div class="ki-formula-builder" id="createFormulaBuilder">
                  <div class="ki-formula-toolbar">
                    <div class="ki-formula-tool-group" aria-label="运算符">
                      <button type="button" class="ki-formula-tool" data-formula-insert="+">+</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="-">-</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="*">*</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="/">/</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="()">()</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="[]">[]</button>
                    </div>
                    <div class="ki-formula-tool-group" aria-label="数值函数">
                      <button type="button" class="ki-formula-tool" data-formula-insert="ROUND()">ROUND</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="ABS()">ABS</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="CEIL()">CEIL</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="FLOOR()">FLOOR</button>
                    </div>
                    <div class="ki-formula-tool-group" aria-label="逻辑函数">
                      <button type="button" class="ki-formula-tool" data-formula-insert="IF()">IF</button>
                      <button type="button" class="ki-formula-tool" data-formula-insert="COALESCE()">COALESCE</button>
                    </div>
                    <button type="button" class="ki-formula-clear" id="createFormulaClear">清空</button>
                  </div>
                  <div class="ki-formula-editor-wrap">
                    <div class="ki-formula-editor" id="createFormulaEditor" contenteditable="true" spellcheck="false">
                      <span class="ki-formula-token" contenteditable="false" data-formula-token="当前产品销售额">当前产品销售额<button type="button" class="ki-formula-token-remove" aria-label="删除当前产品销售额">x</button></span>
                      <span class="ki-formula-op" data-formula-token="/">/</span>
                      <span class="ki-formula-token" contenteditable="false" data-formula-token="总销售额">总销售额<button type="button" class="ki-formula-token-remove" aria-label="删除总销售额">x</button></span>
                    </div>
                    <div class="ki-formula-suggest hidden" id="createFormulaSuggest">
                      <button type="button" class="ki-formula-atom-option" data-formula-atom="非招成交金额" data-search="非招成交金额 jzcjje 成交金额"><span>非招成交金额</span><em>jzcjje</em></button>
                      <button type="button" class="ki-formula-atom-option" data-formula-atom="招标中标金额" data-search="招标中标金额 zbzbje 中标金额"><span>招标中标金额</span><em>zbzbje</em></button>
                      <button type="button" class="ki-formula-atom-option" data-formula-atom="招标项目数" data-search="招标项目数 zbxms 项目数量"><span>招标项目数</span><em>zbxms</em></button>
                      <button type="button" class="ki-formula-atom-option" data-formula-atom="成交客户数" data-search="成交客户数 cjkh 客户"><span>成交客户数</span><em>cjkh</em></button>
                      <div class="ki-formula-empty hidden">暂无匹配原子指标</div>
                    </div>
                  </div>
                  <div class="ki-formula-help">
                    <span>输入 @ 可搜索并插入指标</span>
                    <span>点击上方符号 / 函数会插入到当前光标位置</span>
                    <span>工具栏没有的运算符号，可以自定义输入</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../../assets/js/common.js?v=20260519-system-config"></script>
  <script>
    (function () {
      var editor = document.getElementById('createFormulaEditor');
      var suggest = document.getElementById('createFormulaSuggest');
      var clearBtn = document.getElementById('createFormulaClear');
      var functions = ['ROUND()', 'ABS()', 'CEIL()', 'FLOOR()', 'IF()', 'COALESCE()'];

      function isNumberToken(text) {
        return /^-?\d+(\.\d+)?%?$/.test(String(text || '').trim());
      }

      function isMetricToken(text) {
        text = String(text || '').trim();
        return !!text && !isNumberToken(text) && !functions.some(function (fn) { return fn.toUpperCase() === text.toUpperCase(); })
          && !/^[+\-*/()[\]]+$/.test(text) && /[\u4e00-\u9fa5]/.test(text);
      }

      function selectionInsideEditor() {
        var sel = window.getSelection();
        return !!(sel && sel.rangeCount && editor.contains(sel.anchorNode));
      }

      function setCaretAfter(node) {
        var range = document.createRange();
        range.setStartAfter(node);
        range.collapse(true);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function setCaretToEnd() {
        editor.focus();
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function setCaretFromPoint(event) {
        editor.focus();
        var nodes = Array.prototype.slice.call(editor.childNodes).filter(function (node) {
          if (node.nodeType === 3) return String(node.textContent || '').trim();
          return !(node.classList && node.classList.contains('ki-formula-placeholder'));
        });
        if (nodes.length) {
          var firstRect = nodes[0].getBoundingClientRect && nodes[0].getBoundingClientRect();
          var lastNode = nodes[nodes.length - 1];
          var lastRect = lastNode.getBoundingClientRect && lastNode.getBoundingClientRect();
          if (firstRect && event.clientX <= firstRect.left) {
            var startRange = document.createRange();
            startRange.setStart(editor, 0);
            startRange.collapse(true);
            var startSel = window.getSelection();
            startSel.removeAllRanges();
            startSel.addRange(startRange);
            return;
          }
          if (lastRect && (event.clientX >= lastRect.right || event.clientY > lastRect.bottom)) {
            setCaretToEnd();
            return;
          }
        }
        var range = null;
        if (document.caretPositionFromPoint) {
          var pos = document.caretPositionFromPoint(event.clientX, event.clientY);
          if (pos && editor.contains(pos.offsetNode)) {
            range = document.createRange();
            range.setStart(pos.offsetNode, pos.offset);
          }
        } else if (document.caretRangeFromPoint) {
          var pointRange = document.caretRangeFromPoint(event.clientX, event.clientY);
          if (pointRange && editor.contains(pointRange.startContainer)) {
            range = pointRange;
          }
        }
        if (!range) {
          setCaretToEnd();
          return;
        }
        range.collapse(true);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function createNode(text, isAtom) {
        var span = document.createElement('span');
        span.setAttribute('data-formula-token', text);
        if (isAtom || isMetricToken(text)) {
          span.className = 'ki-formula-token';
          span.contentEditable = 'false';
          span.appendChild(document.createTextNode(text));
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ki-formula-token-remove';
          btn.setAttribute('aria-label', '删除' + text);
          btn.textContent = 'x';
          span.appendChild(btn);
        } else if (/^[+\-*/()[\]]+$/.test(text)) {
          span.className = 'ki-formula-op';
          span.textContent = text;
        } else if (functions.some(function (fn) { return fn.toUpperCase() === String(text).toUpperCase(); })) {
          span.className = 'ki-formula-fn';
          span.textContent = text.replace('()', '');
        } else {
          span.className = 'ki-formula-text';
          span.textContent = text;
        }
        return span;
      }

      function insertPart(text, isAtom) {
        var placeholder = editor.querySelector('.ki-formula-placeholder');
        if (placeholder) placeholder.remove();
        editor.focus();
        var node = createNode(text, isAtom);
        var spacer = document.createTextNode(' ');
        var frag = document.createDocumentFragment();
        frag.appendChild(node);
        frag.appendChild(spacer);
        var sel = window.getSelection();
        var range;
        if (selectionInsideEditor()) {
          range = sel.getRangeAt(0);
        } else {
          range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
        range.deleteContents();
        range.insertNode(frag);
        setCaretAfter(spacer);
      }

      function removePlaceholder() {
        var placeholder = editor.querySelector('.ki-formula-placeholder');
        if (placeholder) placeholder.remove();
      }

      function formulaParts(text) {
        var functionPattern = functions.map(function (fn) {
          return fn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }).join('|');
        var re = new RegExp('(?:' + functionPattern + ')|[+\\-*/()\\[\\]]|[^\\s+\\-*/()\\[\\]]+', 'gi');
        return (String(text || '').match(re) || []).map(function (part) { return part.trim(); }).filter(Boolean);
      }

      function isAtomName(text) {
        return !!suggest.querySelector('.ki-formula-atom-option[data-formula-atom="' + text + '"]');
      }

      function formulaFromEditor() {
        var parts = [];
        Array.prototype.slice.call(editor.childNodes || []).forEach(function (node) {
          if (node.nodeType === 3) {
            formulaParts(node.textContent || '').forEach(function (part) { parts.push(part); });
            return;
          }
          if (node.nodeType !== 1 || node.classList.contains('ki-formula-placeholder')) return;
          var token = node.getAttribute('data-formula-token');
          if (token) {
            parts.push(token);
            return;
          }
          formulaParts(node.textContent || '').forEach(function (part) { if (part && part !== 'x') parts.push(part); });
        });
        return parts.join(' ');
      }

      function normalizeEditor() {
        if (currentTrigger()) return;
        var parts = formulaParts(formulaFromEditor());
        if (!parts.length) return;
        editor.innerHTML = '';
        parts.forEach(function (part) {
          editor.appendChild(createNode(part, isAtomName(part) || isMetricToken(part)));
          editor.appendChild(document.createTextNode(' '));
        });
        setCaretToEnd();
      }

      function textBeforeCaret() {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || !selectionInsideEditor()) return '';
        var range = sel.getRangeAt(0).cloneRange();
        var pre = range.cloneRange();
        pre.selectNodeContents(editor);
        pre.setEnd(range.endContainer, range.endOffset);
        return pre.toString().replace(/\u00a0/g, ' ');
      }

      function currentTrigger() {
        var before = textBeforeCaret();
        var explicit = before.match(/@([\u4e00-\u9fa5a-zA-Z0-9_]*)$/);
        if (explicit) return { query: explicit[1], length: explicit[0].length, explicit: true };
        return null;
      }

      function caretRect() {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || !selectionInsideEditor()) return null;
        var range = sel.getRangeAt(0).cloneRange();
        range.collapse(true);
        var rect = range.getClientRects()[0] || range.getBoundingClientRect();
        if (rect && (rect.width || rect.height)) return rect;
        var marker = document.createElement('span');
        marker.textContent = '\u200b';
        range.insertNode(marker);
        rect = marker.getBoundingClientRect();
        marker.remove();
        return rect;
      }

      function positionSuggest() {
        var wrap = editor.closest('.ki-formula-editor-wrap');
        var wrapRect = wrap.getBoundingClientRect();
        var rect = caretRect() || editor.getBoundingClientRect();
        var maxLeft = Math.max(8, wrapRect.width - 372);
        suggest.style.left = Math.max(8, Math.min(rect.left - wrapRect.left, maxLeft)) + 'px';
        suggest.style.right = 'auto';
        suggest.style.top = Math.max(40, rect.bottom - wrapRect.top + 6) + 'px';
      }

      function visibleOptions() {
        return Array.prototype.slice.call(suggest.querySelectorAll('.ki-formula-atom-option')).filter(function (row) {
          return !row.classList.contains('hidden');
        });
      }

      function setActive(index) {
        var rows = visibleOptions();
        rows.forEach(function (row) { row.classList.remove('is-active'); });
        if (!rows.length) return;
        var next = ((index % rows.length) + rows.length) % rows.length;
        rows[next].classList.add('is-active');
        rows[next].scrollIntoView({ block: 'nearest' });
      }

      function activeOption() {
        return suggest.querySelector('.ki-formula-atom-option.is-active:not(.hidden)') || visibleOptions()[0] || null;
      }

      function filterSuggest() {
        var trigger = currentTrigger();
        if (!trigger || (!trigger.explicit && !trigger.query)) {
          suggest.classList.add('hidden');
          return;
        }
        suggest.classList.remove('hidden');
        positionSuggest();
        var kw = trigger.query.trim().toLowerCase();
        var visible = 0;
        suggest.querySelectorAll('.ki-formula-atom-option').forEach(function (row) {
          var matched = !kw || (row.getAttribute('data-search') || row.textContent).toLowerCase().indexOf(kw) >= 0;
          row.classList.toggle('hidden', !matched);
          if (matched) visible++;
        });
        suggest.querySelector('.ki-formula-empty').classList.toggle('hidden', visible > 0);
        setActive(0);
      }

      function removeTriggerText() {
        var trigger = currentTrigger();
        var sel = window.getSelection();
        if (!trigger || !sel || !sel.rangeCount || !selectionInsideEditor()) return;
        var node = sel.anchorNode;
        if (!node || node.nodeType !== 3) return;
        var offset = sel.anchorOffset;
        var start = Math.max(0, offset - trigger.length);
        node.textContent = node.textContent.slice(0, start) + node.textContent.slice(offset);
        var range = document.createRange();
        range.setStart(node, start);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      editor.addEventListener('focus', removePlaceholder);
      editor.addEventListener('input', function () {
        removePlaceholder();
        filterSuggest();
      });
      editor.addEventListener('blur', normalizeEditor);
      editor.addEventListener('click', function (event) {
        if (event.target.classList.contains('ki-formula-token-remove')) {
          event.preventDefault();
          event.target.closest('.ki-formula-token').remove();
          return;
        }
        if (!event.target.closest('.ki-formula-token')) {
          setCaretFromPoint(event);
        }
        removePlaceholder();
        filterSuggest();
      });
      editor.addEventListener('keyup', filterSuggest);
      document.querySelector('.ki-formula-toolbar').addEventListener('mousedown', function (event) {
        if (event.target.closest('button')) event.preventDefault();
      });
      editor.addEventListener('keydown', function (event) {
        if (suggest.classList.contains('hidden')) return;
        var rows = visibleOptions();
        if (!rows.length && event.key !== 'Escape') return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          var current = rows.findIndex(function (row) { return row.classList.contains('is-active'); });
          setActive(current + (event.key === 'ArrowDown' ? 1 : -1));
          return;
        }
        if (event.key === 'Enter') {
          var option = activeOption();
          if (!option) return;
          event.preventDefault();
          removeTriggerText();
          insertPart(option.getAttribute('data-formula-atom'), true);
          suggest.classList.add('hidden');
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          suggest.classList.add('hidden');
        }
      });
      document.querySelectorAll('[data-formula-insert]').forEach(function (btn) {
        btn.addEventListener('click', function () { insertPart(btn.getAttribute('data-formula-insert'), false); });
      });
      suggest.addEventListener('click', function (event) {
        var row = event.target.closest('.ki-formula-atom-option');
        if (!row) return;
        removeTriggerText();
        insertPart(row.getAttribute('data-formula-atom'), true);
        suggest.classList.add('hidden');
      });
      clearBtn.addEventListener('click', function () {
        editor.innerHTML = '<span class="ki-formula-placeholder">输入 @ 搜索指标，或直接输入公式 / 点击上方符号</span>';
        suggest.classList.add('hidden');
      });
      document.addEventListener('click', function (event) {
        if (!event.target.closest('#createFormulaBuilder')) suggest.classList.add('hidden');
      });
    })();
  </script>
</body>
</html>
