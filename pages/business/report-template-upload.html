<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上传报告模板 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu"><button class="menu-item" onclick="goTo('report.html')">我的报告</button></nav>
    <div class="top-actions"><button class="secondary-btn" onclick="goTo('report.html')">返回</button></div>
  </header>
  <main class="business-page" style="grid-template-columns:1fr;">
    <section class="module-content">
      <div class="module-content-head"><h2>上传报告模板</h2></div>
      <div class="module-scroll">
        <div class="report-page" style="max-width:860px;">
          <div class="upload-drop">
            <div class="upload-icon">↑</div>
            <strong>拖拽或选择 Word/PPT 模板</strong>
            <span>支持 .docx / .pptx，系统会自动提取章节结构。</span>
          </div>
          <div class="field" style="margin-top:16px;"><label>模板名称</label><input value="管理层月度经营模板 v2" /></div>
          <div class="toolbar"><button class="ghost-btn" onclick="goTo('report.html')">取消</button><button class="primary-btn" onclick="goTo('report.html')">确认上传</button></div>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/common.js"></script>
</body>
</html>
