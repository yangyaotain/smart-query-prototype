<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>看板分享 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>

  <main class="business-page" style="grid-template-columns:1fr;">
    <section class="module-content">
      <div class="module-content-head"><h2>看板分享设置</h2></div>

        <div class="report-page" style="max-width:860px;">
          <div class="field"><label>分享链接</label><input value="https://prototype.local/board/sales-overview?token=ab12cd" /></div>

          <div class="toolbar"><button class="secondary-btn" onclick="goTo('board.html')">复制链接</button><button class="primary-btn" onclick="goTo('board.html')">发送给成员</button></div>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/common.js"></script>
