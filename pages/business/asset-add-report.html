<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>添加图表到报告 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu"><button class="menu-item" onclick="goTo('dashboard.html')">我的仪表盘</button><button class="menu-item" onclick="goTo('report.html')">我的报告</button></nav>
    <div class="top-actions"><button class="secondary-btn" onclick="goTo('dashboard.html')">返回</button></div>
  </header>
  <main class="business-page" style="grid-template-columns:1fr;">
    <section class="module-content">
      <div class="module-content-head"><h2>添加到报告</h2></div>
      <div class="module-scroll">
        <div class="report-page" style="max-width:820px;">
          <p>图表：<strong>本月渠道订单转化率对比</strong></p>
          <div class="field"><label>目标报告</label><select><option>二季度销售复盘报告</option><option>4月经营分析报告</option></select></div>
          <div class="field"><label>插入章节</label><select><option>二、区域销售表现</option><option>三、异常增长归因</option><option>四、经营建议</option></select></div>
          <div class="field"><label>图表说明</label><textarea>本图用于对比各渠道转化效率，建议结合促销策略进行解释。</textarea></div>
          <div class="toolbar"><button class="ghost-btn" onclick="goTo('dashboard.html')">取消</button><button class="primary-btn" onclick="goTo('report.html')">确认添加</button></div>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/common.js"></script>
</body>
</html>
