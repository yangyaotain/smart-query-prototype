<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的报告 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
  <style>
    /* ============================================================
     * 我的报告页面（参考我的看板，对齐目录树 + 顶部导出/编辑结构）
     * ============================================================ */
    .report-page-body .report-content-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .report-page-body article.report-page {
      max-width: 940px;
      margin: 0 auto;
      padding: 32px 40px 56px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .report-page-body article.report-page > h1 {
      margin: 0 0 6px;
      color: #17375e;
      font-size: 24px;
      font-weight: 700;
    }

    .report-page-body article.report-page > h2 {
      margin: 28px 0 10px;
      color: #17375e;
      font-size: 18px;
      font-weight: 700;
      padding-left: 10px;
      border-left: 4px solid var(--primary);
    }

    .report-page-body article.report-page p {
      margin: 8px 0;
      color: #374151;
      font-size: 14px;
      line-height: 1.85;
    }

    .report-page-body article.report-page .report-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .report-page-body article.report-page > h3 {
      margin: 18px 0 8px;
      color: #1e3a5f;
      font-size: 15px;
      font-weight: 700;
    }

    .report-page-body article.report-page ul,
    .report-page-body article.report-page ol {
      margin: 8px 0 8px 22px;
      color: #374151;
      font-size: 14px;
      line-height: 1.85;
    }

    .report-page-body article.report-page ul li,
    .report-page-body article.report-page ol li {
      margin: 3px 0;
    }

    .report-page-body article.report-page blockquote {
      margin: 12px 0;
      padding: 10px 16px;
      color: #475569;
      background: #f8fbff;
      border-left: 3px solid var(--primary);
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.85;
    }

    .report-page-body article.report-page blockquote strong {
      color: var(--primary);
    }

    /* KPI 卡片行（用于报告概览） */
    .report-page-body article.report-page .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .report-page-body article.report-page .kpi-row.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .report-page-body article.report-page .kpi-card {
      padding: 12px 14px;
      background: linear-gradient(180deg, #f8fbff, #fff);
      border: 1px solid #e6eefb;
      border-radius: 12px;
    }

    .report-page-body article.report-page .kpi-card .lbl {
      color: #6b7280;
      font-size: 12px;
    }

    .report-page-body article.report-page .kpi-card .val {
      margin-top: 4px;
      color: #17375e;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .report-page-body article.report-page .kpi-card .delta {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .report-page-body article.report-page .kpi-card .delta.up {
      color: #16a34a;
    }

    .report-page-body article.report-page .kpi-card .delta.down {
      color: #dc2626;
    }

    .report-page-body article.report-page .kpi-card .delta.warn {
      color: #d97706;
    }

    /* 数据表格 */
    .report-page-body article.report-page table.data-table {
      width: 100%;
      margin: 12px 0;
      border-collapse: collapse;
      font-size: 13px;
    }

    .report-page-body article.report-page table.data-table th,
    .report-page-body article.report-page table.data-table td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid #eef2f7;
    }

    .report-page-body article.report-page table.data-table th {
      color: #475569;
      background: #f8fbff;
      font-weight: 600;
    }

    .report-page-body article.report-page table.data-table td.num {
      text-align: right;
      color: #17375e;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .report-page-body article.report-page table.data-table tr:hover td {
      background: #f9fbfd;
    }

    /* 标签行 */
    .report-page-body article.report-page .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 4px;
    }

    .report-page-body article.report-page .tag-row .tag {
      padding: 4px 10px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 图表占位（带 ECharts 容器） */
    .report-page-body article.report-page .asset-preview {
      margin: 14px 0;
      height: 320px;
      padding: 14px 16px 18px;
      background: linear-gradient(180deg, #fbfdff, #fff);
      border: 1px solid #e6eefb;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #475569;
      font-size: 12.5px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .report-page-body article.report-page .asset-preview .ap-head {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 600;
    }

    .report-page-body article.report-page .asset-preview .ap-head .ap-tag {
      padding: 2px 8px;
      color: #fff;
      background: var(--primary);
      border-radius: 999px;
      font-size: 11px;
    }

    .report-page-body article.report-page .asset-preview .ap-body,
    .report-page-body article.report-page .asset-preview .chart-canvas {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .report-page-body .context-card.section-nav {
      align-self: start;
      position: sticky;
      top: 0;
      max-height: calc(100vh - 200px);
      overflow: auto;
    }

    .report-page-body .context-card.section-nav h4 {
      margin: 0 0 10px;
      color: #17375e;
      font-size: 13px;
      font-weight: 700;
    }

    .report-page-body .context-card.section-nav .section-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      margin-bottom: 4px;
      color: #475569;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .report-page-body .context-card.section-nav .section-link:hover {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .report-page-body .context-card.section-nav .section-link.active {
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    /* —— 树节点 hover 高亮目录的报告数 —— */
    .report-page-body .dir-tree .tree-node[data-type="category"] > .tree-row .tree-count {
      padding: 0 7px;
      height: 16px;
      line-height: 16px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    /* —— 报告（叶子）专用图标：文档/报告样式（带折角纸张 + 横线），与分类的文件夹明显区分 —— */
    .report-page-body .dir-tree .tree-node[data-type="report"] > .tree-row > .tree-icon {
      background: linear-gradient(135deg, #eef6ff, #f8fbff);
      border-color: rgba(22, 119, 255, 0.24);
    }

    .report-page-body .dir-tree .tree-node[data-type="report"] > .tree-row > .tree-icon::before {
      background-color: #2f6fdc;
      -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M7 3h7l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z'/><path d='M14 3v4h4'/><path d='M9 12h6'/><path d='M9 16h4'/></svg>");
      mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M7 3h7l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z'/><path d='M14 3v4h4'/><path d='M9 12h6'/><path d='M9 16h4'/></svg>");
    }

    .report-page-body .dir-tree .tree-node[data-type="report"] > .tree-row.active > .tree-icon,
    .report-page-body .dir-tree .tree-node[data-type="report"] > .tree-row:hover > .tree-icon {
      background: linear-gradient(135deg, #e1efff, #f0f7ff);
      border-color: rgba(22, 119, 255, 0.55);
      box-shadow: 0 3px 8px rgba(22, 119, 255, 0.18);
    }

    .report-page-body .dir-tree .tree-node[data-type="report"] > .tree-row.active > .tree-icon::before {
      background-color: var(--primary);
    }

    /* 通用 prompt 弹窗的表单行 */
    .report-page-body .modal .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .report-page-body .modal .form-row label {
      color: #6b7280;
      font-size: 12px;
      font-weight: 600;
    }

    .report-page-body .modal .form-row input {
      width: 100%;
      padding: 9px 12px;
      color: #374151;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13.5px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .report-page-body .modal .form-row input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    /* 右键临时态 */
    .report-page-body .dir-tree .tree-row.ctx-target {
      background: rgba(22, 119, 255, 0.08);
      box-shadow: inset 2px 0 0 var(--primary);
    }
  </style>
</head>
<body class="report-page-body">
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu">
      <button class="menu-item" onclick="goTo('smart-query.html')">智能问数</button>
      <button class="menu-item" onclick="goTo('dashboard.html')">我的仪表盘</button>
      <button class="menu-item" onclick="goTo('board.html')">我的看板</button>
      <button class="menu-item active">我的报告</button>
    </nav>
    <div class="top-actions">
      <button class="admin-link icon-btn" onclick="goTo('../admin/data-source.html')"><span class="btn-icon">⚙</span>管理后台</button>
      <button class="user-trigger" type="button"><div class="avatar">张</div><strong>张三</strong><span class="dropdown-arrow"></span></button>
    </div>
  </header>

  <main class="business-page">
    <!-- ==================== 左侧：报告目录树 ==================== -->
    <aside class="module-sidebar">
      <div class="module-side-head">
        <div class="side-head-row">
          <h3>报告目录</h3>
          <span class="info-tip" data-tip="右键节点可新增分类 / 新增报告 / 重命名 / 删除；支持搜索过滤">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"></path>
              <circle cx="12" cy="16.5" r="0.6" fill="currentColor"></circle>
            </svg>
          </span>
        </div>
        <input class="search-box" id="reportTreeSearch" style="margin-top:12px;" placeholder="搜索目录 / 报告" />
      </div>
      <div class="tree-list dir-tree" id="reportDirTree"></div>

      <!-- 右键菜单 -->
      <div class="context-menu hidden" id="reportCtxMenu">
        <button data-action="add-category"><span class="ctx-icon">＋</span>新增分类</button>
        <button data-action="add-report"><span class="ctx-icon">📄</span>新增报告</button>
        <button data-action="rename"><span class="ctx-icon">✎</span>重命名</button>
        <button data-action="delete" class="danger"><span class="ctx-icon">🗑</span>删除</button>
      </div>
    </aside>

    <!-- ==================== 右侧：报告内容 ==================== -->
    <section class="module-content">
      <div class="module-content-head">
        <div>
          <h2 id="reportTitle">二季度销售复盘报告</h2>
          <p id="reportMetaTop" style="margin:6px 0 0;color:#6b7280;font-size:13px;">来源：智能问数数据解读、归因分析、我的仪表盘</p>
        </div>
        <div class="toolbar">
          <button class="action-dropdown-btn" type="button" id="reportExportBtn" onclick="toggleReportExport(event)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"></path><path d="M8.5 10.5L12 14l3.5-3.5"></path><path d="M5 19h14"></path></svg>
            <span>导出</span>
            <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
          </button>
          <button class="action-dropdown-btn primary" type="button" onclick="goTo('report-edit.html')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.06 4.94l5 5"/><path d="M3 21l1.5-5.5L18 2.5a2.83 2.83 0 0 1 4 4L8.5 19.5 3 21Z"/></svg>
            <span>编辑报告</span>
          </button>
        </div>
      </div>
      <div class="module-scroll report-content-wrap">
        <div class="report-layout">
          <aside class="context-card section-nav" style="height:max-content;">
            <h4>报告章节</h4>
            <div id="reportSectionList"></div>
          </aside>
          <article class="report-page" id="reportArticle"></article>
        </div>
      </div>
    </section>
  </main>

  <!-- 导出菜单（与我的看板同款） -->
  <div id="reportExportMenu" class="context-menu export-menu hidden">
    <button onclick="reportExportAction('pdf')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l4 4v12H7z"></path><path d="M14 4v4h4"></path><path d="M9 16h6"></path></svg><span>导出 PDF</span></button>
    <button onclick="reportExportAction('word')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9l1.5 6L12 9l2.5 6L16 9"></path></svg><span>导出 Word</span></button>
    <button onclick="reportExportAction('image')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M7 15l3-3 2.5 2.5 2.5-3 2 3.5"></path><path d="M9 9h.01"></path></svg><span>导出图片</span></button>
    <button onclick="reportExportAction('excel')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M9 9l6 6"></path><path d="M15 9l-6 6"></path></svg><span>导出 Excel</span></button>
  </div>

  <!-- 重命名/新增 通用对话框 -->
  <div class="modal-mask hidden" id="promptMask"></div>
  <section class="modal small hidden" id="promptModal">
    <div class="modal-head">
      <div>
        <h3 id="promptTitle">重命名</h3>
        <p id="promptSubtitle">输入新的名称</p>
      </div>
      <button class="close" data-act="cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label for="promptInput" id="promptLabel">名称</label>
        <input id="promptInput" type="text" maxlength="40" />
      </div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" data-act="cancel">取消</button>
      <button class="primary-btn" data-act="ok">确定</button>
    </div>
  </section>

  <!-- 删除确认弹窗 -->
  <div class="modal-mask hidden" id="confirmMask"></div>
  <section class="modal small hidden" id="confirmModal">
    <div class="modal-head">
      <div>
        <h3 id="confirmTitle">删除</h3>
        <p id="confirmSubtitle">删除后将无法恢复。</p>
      </div>
      <button class="close" data-act="cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="ai-tip" id="confirmMessage">确定要删除该项吗？</div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" data-act="cancel">取消</button>
      <button class="primary-btn" data-act="ok">确认删除</button>
    </div>
  </section>

  <script src="../../assets/js/echarts.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script>
    /* eslint-disable */
    (function () {
      // ====================================================================
      // 1. 报告数据
      // ====================================================================
      // ========== 公共图表占位（占位容器，由 renderCharts 后期挂载 ECharts） ==========
      let _chartUid = 0;
      function ap(type, title) {
        _chartUid += 1;
        return (
          '<div class="asset-preview" data-chart="' + type + '" data-chart-title="' + escapeAttr(title) + '" data-chart-id="rc' + _chartUid + '">' +
            '<div class="ap-head"><span class="ap-tag">' + tagLabel(type) + '</span><span>' + escapeHTML(title) + '</span></div>' +
            '<div class="ap-body chart-canvas"></div>' +
          '</div>'
        );
      }
      function tagLabel(t) {
        return ({
          line: '趋势', bar: '柱状', 'bar-h': '条形', 'stacked-bar': '堆叠柱',
          pie: '饼图', funnel: '漏斗', radar: '雷达', heatmap: '热力'
        })[t] || '图表';
      }
      function escapeAttr(s) {
        return String(s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      const REPORT_DATA = {
        // ============================================================
        // r1 · 二季度销售复盘报告（核心样例，5 节，最详细）
        // ============================================================
        r1: {
          title: '二季度销售复盘报告',
          metaTop: '来源：智能问数数据解读、归因分析、我的仪表盘 · 数据周期：2026-04-01 ~ 2026-06-30',
          generatedAt: '2026-06-30',
          type: '经营分析 · 季度复盘',
          sections: [
            { id: 's1', name: '一、经营概览' },
            { id: 's2', name: '二、区域销售表现' },
            { id: 's3', name: '三、异常增长归因' },
            { id: 's4', name: '四、问题与风险' },
            { id: 's5', name: '五、经营建议' }
          ],
          body:
            '<p>本报告基于智能问数二季度全量数据自动生成，覆盖经营全景、区域、渠道、产品、客户五大维度，重点回答"二季度做得如何、靠什么增长、有什么风险、下一步怎么做"四个核心问题，可作为经营会议汇报与下季度策略输入。</p>' +
            '<div class="tag-row">' +
              '<span class="tag">趋势上行</span>' +
              '<span class="tag">华东主力</span>' +
              '<span class="tag">线上渠道领跑</span>' +
              '<span class="tag">TOP10 集中度 67%</span>' +
              '<span class="tag">目标差距 14%</span>' +
            '</div>' +

            '<h2 id="s1">一、经营概览</h2>' +
            '<p>二季度整体销售保持增长态势，华东区连续 6 个月环比正增长，线上电商与重点客户订单释放是主要增长引擎；目标完成率 86%，距离季度目标仍有 14%，6 月需重点冲刺。</p>' +
            '<div class="kpi-row">' +
              '<div class="kpi-card"><div class="lbl">销售额（万元）</div><div class="val">9,258</div><div class="delta up">同比 +12.4% · 环比 +4.1%</div></div>' +
              '<div class="kpi-card"><div class="lbl">订单量（单）</div><div class="val">52,140</div><div class="delta up">同比 +8.6% · 环比 +2.3%</div></div>' +
              '<div class="kpi-card"><div class="lbl">客单价（元）</div><div class="val">1,776</div><div class="delta up">同比 +3.5% · 环比 +1.8%</div></div>' +
              '<div class="kpi-card"><div class="lbl">目标完成率</div><div class="val">86%</div><div class="delta warn">距目标 14%，需关注</div></div>' +
            '</div>' +
            '<h3>1.1 同比 / 环比对比</h3>' +
            '<ul>' +
              '<li>同比增长：销售额 <strong>+12.4%</strong>，订单量 <strong>+8.6%</strong>，客单价 <strong>+3.5%</strong>，整体跑赢去年同期。</li>' +
              '<li>环比 1 季度：销售额 <strong>+4.1%</strong>，进入二季度后增长斜率明显抬升，4-6 月持续正向。</li>' +

            '<h2 id="s3">三、风险与应对</h2>' +

              '<thead><tr><th>风险</th><th>影响范围</th><th>应对策略</th><th>负责人</th></tr></thead>' +
              '<tbody>' +
                '<tr><td>北区目标缺口</td><td>影响整体目标 -2.1 pct</td><td>促销补强 + 渠道下沉</td><td>北区销售总监</td></tr>' +
                '<tr><td>库存周转上升</td><td>挤占现金流</td><td>慢动品清仓 + 长尾淘汰</td><td>供应链负责人</td></tr>' +
                '<tr><td>头部客户流失预警</td><td>风险销售 19%</td><td>1V1 走访 + 专属服务包</td><td>大客户事业部</td></tr>' +
                '<tr><td>毛利率小幅承压</td><td>影响利润 -0.6 pct</td><td>降低促销依赖 + 高端占比</td><td>市场 + 产品</td></tr>' +
              '</tbody>' +
            '</table>' +

            '<h2 id="s4">四、下月计划</h2>' +
            '<ol>' +
              '<li>北区促销补强专项（30 天）：目标销售额 +8%；</li>' +
              '<li>库存周转改善专项：目标 ≤40 天；</li>' +
              '<li>流失客户挽回专项：目标 3 家全部恢复 80% 订单；</li>' +
              '<li>整体目标完成率冲刺到 <strong>92%</strong>。</li>' +
            '</ol>' +
            ap('bar', '下月各专项目标拆解') +

            '<h2 id="s5">五、关键决策项</h2>' +
            '<blockquote>' +
              '<strong>决策项 1：</strong>是否批准北区促销专项预算 80 万元（预期带来销售 +260 万元、ROI 3.25）。<br/>' +
              '<strong>决策项 2：</strong>是否同意启动长尾 SKU 清退（影响 23% SKU、预计提升毛利率 0.6-0.8 pct）。<br/>' +
              '<strong>决策项 3：</strong>是否同意大客户事业部增配 2 名 1V1 客户经理（年化人力成本 60 万元）。' +
            '</blockquote>'
        }
      };

      // 目录树（分类 → 报告）
      let DIR_TREE = [
        {
          id: 'c1', name: '销售经营', expanded: true,
          reports: [
            { id: 'r1', name: '二季度销售复盘报告' },
            { id: 'r2', name: '4月经营分析报告' },
            { id: 'r3', name: '华东区销售专题分析' }
          ]
        },
        {
          id: 'c2', name: '渠道与产品', expanded: true,
          reports: [
            { id: 'r4', name: '渠道转化专项报告' },
            { id: 'r5', name: '产品线毛利分析报告' }
          ]
        },
        {
          id: 'c3', name: '客户运营', expanded: false,
          reports: [
            { id: 'r6', name: '重点客户复购报告' },
            { id: 'r7', name: '客户分层运营报告' }
          ]
        },
        {
          id: 'c4', name: '管理层汇报', expanded: true,
          reports: [
            { id: 'r8', name: '月度经营汇报' }
          ]
        }
      ];

      // ====================================================================
      // 2. 渲染目录树
      // ====================================================================
      const tree = document.getElementById('reportDirTree');
      const searchInput = document.getElementById('reportTreeSearch');
      let activeReportId = 'r1';

      function renderTree() {
        tree.innerHTML = DIR_TREE.map(buildCategoryHTML).join('');
        // 还原 active 高亮
        const activeRow = tree.querySelector('.tree-node[data-id="' + activeReportId + '"] > .tree-row');
        if (activeRow) activeRow.classList.add('active');
      }

      function buildCategoryHTML(cat) {
        const stateCls = (cat.reports && cat.reports.length) ? (cat.expanded ? 'expanded' : 'collapsed') : 'leaf';
        const toggleIcon = (cat.reports && cat.reports.length) ? (cat.expanded ? '▾' : '▸') : '';
        const toggleCls = (cat.reports && cat.reports.length) ? '' : ' empty';
        const inner = (cat.reports || []).map(buildReportHTML).join('');
        return (
          '<div class="tree-node ' + stateCls + '" data-id="' + cat.id + '" data-level="1" data-type="category" draggable="true">' +
            '<div class="tree-row">' +
              '<span class="tree-toggle' + toggleCls + '">' + toggleIcon + '</span>' +
              '<span class="tree-icon"></span>' +
              '<span class="tree-label">' + escapeHTML(cat.name) + '</span>' +
              '<span class="tree-count">' + (cat.reports || []).length + '</span>' +
            '</div>' +
            (inner ? '<div class="tree-children">' + inner + '</div>' : '') +
          '</div>'
        );
      }

      function buildReportHTML(rp) {
        return (
          '<div class="tree-node leaf" data-id="' + rp.id + '" data-level="2" data-type="report" draggable="true">' +
            '<div class="tree-row">' +
              '<span class="tree-toggle empty"></span>' +
              '<span class="tree-icon"></span>' +
              '<span class="tree-label">' + escapeHTML(rp.name) + '</span>' +
            '</div>' +
          '</div>'
        );
      }

      // ====================================================================
      // 3. 树交互：展开 / 收起 / 选中报告
      // ====================================================================
      tree.addEventListener('click', function (e) {
        const toggle = e.target.closest('.tree-toggle');
        const row = e.target.closest('.tree-row');
        if (!row) return;
        const node = row.parentElement;

        if (toggle && !toggle.classList.contains('empty')) {
          e.stopPropagation();
          toggleCategory(node);
          return;
        }

        if (node.dataset.type === 'category') {
          toggleCategory(node);
        } else if (node.dataset.type === 'report') {
          tree.querySelectorAll('.tree-row.active').forEach((el) => el.classList.remove('active'));
          row.classList.add('active');
          activeReportId = node.dataset.id;
          renderReport(activeReportId);
        }
      });

      function toggleCategory(node) {
        const id = node.dataset.id;
        const cat = DIR_TREE.find((c) => c.id === id);
        if (!cat) return;
        cat.expanded = !cat.expanded;
        const toggle = node.querySelector(':scope > .tree-row > .tree-toggle');
        if (cat.expanded) {
          node.classList.remove('collapsed');
          node.classList.add('expanded');
          if (toggle && !toggle.classList.contains('empty')) toggle.textContent = '▾';
        } else {
          node.classList.remove('expanded');
          node.classList.add('collapsed');
          if (toggle && !toggle.classList.contains('empty')) toggle.textContent = '▸';
        }
      }

      // ====================================================================
      // 4. 搜索过滤
      // ====================================================================
      searchInput.addEventListener('input', function () {
        const kw = this.value.trim().toLowerCase();
        tree.querySelectorAll('.tree-node').forEach((n) => (n.style.display = ''));
        if (!kw) return;
        const matchSet = new Set();
        tree.querySelectorAll('.tree-node').forEach((node) => {
          const label = node.querySelector(':scope > .tree-row > .tree-label').textContent.toLowerCase();
          if (label.includes(kw)) {
            matchSet.add(node);
            // 父链
            let p = node.parentElement.closest('.tree-node');
            while (p) {
              matchSet.add(p);
              p.classList.remove('collapsed');
              p.classList.add('expanded');
              const t = p.querySelector(':scope > .tree-row > .tree-toggle');
              if (t && !t.classList.contains('empty')) t.textContent = '▾';
              p = p.parentElement.closest('.tree-node');
            }
          }
        });
        tree.querySelectorAll('.tree-node').forEach((node) => {
          if (!matchSet.has(node)) node.style.display = 'none';
        });
      });

      // ====================================================================
      // 5. 右键菜单（新增分类 / 新增报告 / 重命名 / 删除）
      // ====================================================================
      const ctxMenu = document.getElementById('reportCtxMenu');
      let ctxTargetNode = null;

      tree.addEventListener('contextmenu', function (e) {
        const row = e.target.closest('.tree-row');
        if (!row) return;
        e.preventDefault();
        const node = row.parentElement;
        ctxTargetNode = node;
        // 选中目录态
        tree.querySelectorAll('.tree-row.ctx-target').forEach((el) => el.classList.remove('ctx-target'));
        row.classList.add('ctx-target');
        showCtxMenuAt(e.clientX, e.clientY, node.dataset.type);
      });

      // 整体也可在空白处右键 → 新增分类
      tree.parentElement.addEventListener('contextmenu', function (e) {
        if (e.target.closest('.tree-node')) return;
        e.preventDefault();
        ctxTargetNode = null;
        showCtxMenuAt(e.clientX, e.clientY, 'empty');
      });

      function showCtxMenuAt(x, y, type) {
        ctxMenu.classList.remove('hidden');
        // 不同节点类型禁用部分操作
        ctxMenu.querySelectorAll('button').forEach((b) => (b.disabled = false));
        const renameBtn = ctxMenu.querySelector('[data-action="rename"]');
        const deleteBtn = ctxMenu.querySelector('[data-action="delete"]');
        if (type === 'empty') {
          renameBtn.disabled = true;
          deleteBtn.disabled = true;
        }
        // 定位（避免出屏）
        const w = ctxMenu.offsetWidth || 168;
        const h = ctxMenu.offsetHeight || 180;
        let left = x;
        let top = y;
        if (left + w + 8 > window.innerWidth) left = window.innerWidth - w - 8;
        if (top + h + 8 > window.innerHeight) top = window.innerHeight - h - 8;
        ctxMenu.style.left = left + 'px';
        ctxMenu.style.top = top + 'px';
      }

      function hideCtxMenu() {
        ctxMenu.classList.add('hidden');
        tree.querySelectorAll('.tree-row.ctx-target').forEach((el) => el.classList.remove('ctx-target'));
        ctxTargetNode = null;
      }

      document.addEventListener('click', (e) => {
        if (!ctxMenu.classList.contains('hidden') && !e.target.closest('#reportCtxMenu')) hideCtxMenu();
      });
      window.addEventListener('scroll', hideCtxMenu, true);
      window.addEventListener('resize', hideCtxMenu);

      ctxMenu.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        const action = btn.dataset.action;
        const target = ctxTargetNode;
        hideCtxMenu();
        if (action === 'add-category') {
          showPrompt({
            title: '新增分类', subtitle: '为新的报告分类命名',
            label: '分类名称', value: '',
            onConfirm: function (value) {
              const name = (value || '').trim();
              if (!name) return;
              DIR_TREE.push({ id: 'c-' + Date.now(), name: name, expanded: true, reports: [] });
              renderTree();
              showToast('已新增分类：' + name);
            }
          });
        } else if (action === 'add-report') {
          let categoryId = null;
          if (target) {
            categoryId = (target.dataset.type === 'category')
              ? target.dataset.id
              : (target.parentElement.closest('.tree-node[data-type="category"]') || {}).dataset && target.parentElement.closest('.tree-node[data-type="category"]').dataset.id;
          }
          if (!categoryId) categoryId = DIR_TREE[0] && DIR_TREE[0].id;
          if (!categoryId) { showToast('请先新增分类'); return; }
          showPrompt({
            title: '新增报告', subtitle: '为新的报告命名',
            label: '报告名称', value: '',
            onConfirm: function (value) {
              const name = (value || '').trim();
              if (!name) return;
              const cat = DIR_TREE.find((c) => c.id === categoryId);
              if (!cat) return;
              const newId = 'r-' + Date.now();
              cat.reports.push({ id: newId, name: name });
              cat.expanded = true;
              REPORT_DATA[newId] = {
                title: name,
                metaTop: '新建报告 · 待编辑',
                generatedAt: new Date().toISOString().slice(0, 10),
                type: '自定义',
                sections: [{ id: 's1', name: '一、概览' }],
                body: '<h2 id="s1">一、概览</h2><p>请点击「编辑报告」开始撰写正文。</p>'
              };
              renderTree();
              showToast('已新增报告：' + name);
            }
          });
        } else if (action === 'rename') {
          if (!target) return;
          const oldName = target.querySelector(':scope > .tree-row > .tree-label').textContent;
          showPrompt({
            title: '重命名', subtitle: '为节点设置新的名称',
            label: '名称', value: oldName,
            onConfirm: function (value) {
              const name = (value || '').trim();
              if (!name || name === oldName) return;
              if (target.dataset.type === 'category') {
                const cat = DIR_TREE.find((c) => c.id === target.dataset.id);
                if (cat) cat.name = name;
              } else {
                for (const cat of DIR_TREE) {
                  const r = cat.reports.find((x) => x.id === target.dataset.id);
                  if (r) {
                    r.name = name;
                    if (REPORT_DATA[r.id]) REPORT_DATA[r.id].title = name;
                    break;
                  }
                }
              }
              renderTree();
              if (target.dataset.id === activeReportId) renderReport(activeReportId);
              showToast('已重命名：' + name);
            }
          });
        } else if (action === 'delete') {
          if (!target) return;
          const name = target.querySelector(':scope > .tree-row > .tree-label').textContent;
          const isCat = target.dataset.type === 'category';
          showConfirm({
            title: isCat ? '删除分类' : '删除报告',
            subtitle: isCat ? '该分类下所有报告将一并删除。' : '删除后将无法恢复。',
            message: '确定要删除「<span style="color:#17375e;font-weight:700;">' + escapeHTML(name) + '</span>」吗？',
            onConfirm: function () {
              if (isCat) {
                const cat = DIR_TREE.find((c) => c.id === target.dataset.id);
                const removedIds = (cat && cat.reports || []).map((r) => r.id);
                DIR_TREE = DIR_TREE.filter((c) => c.id !== target.dataset.id);
                removedIds.forEach((id) => { delete REPORT_DATA[id]; });
                if (removedIds.indexOf(activeReportId) >= 0) {
                  const first = firstReportId();
                  activeReportId = first;
                  if (first) renderReport(first);
                }
              } else {
                for (const cat of DIR_TREE) {
                  const idx = cat.reports.findIndex((x) => x.id === target.dataset.id);
                  if (idx >= 0) {
                    cat.reports.splice(idx, 1);
                    delete REPORT_DATA[target.dataset.id];
                    break;
                  }
                }
                // 切换 active
                if (target.dataset.id === activeReportId) {
                  const first = firstReportId();
                  activeReportId = first;
                  if (first) renderReport(first);
                }
              }
              renderTree();
              showToast('已删除');
            }
          });
        }
      });

      function firstReportId() {
        for (const cat of DIR_TREE) {
          if (cat.reports && cat.reports.length) return cat.reports[0].id;
        }
        return null;
      }

      // ====================================================================
      // 6. info-tip 顶层 popover（与其他页一致）
      // ====================================================================
      (function setupTip() {
        const tips = document.querySelectorAll('.info-tip');
        let pop = null;
        function show(el) {
          const text = el.dataset.tip || '';
          if (!text) return;
          pop = document.createElement('div');
          pop.className = 'info-tip-popover';
          pop.textContent = text;
          document.body.appendChild(pop);
          const rect = el.getBoundingClientRect();
          let left = rect.left - 8;
          const top = rect.bottom + 10;
          requestAnimationFrame(() => {
            const pw = pop.offsetWidth;
            if (left + pw + 8 > window.innerWidth) left = window.innerWidth - pw - 8;
            if (left < 8) left = 8;
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.classList.add('visible');
          });
        }
        function hide() { if (pop) { pop.remove(); pop = null; } }
        tips.forEach((el) => {
          el.addEventListener('mouseenter', () => show(el));
          el.addEventListener('mouseleave', hide);
        });
        window.addEventListener('scroll', hide, true);
      })();

      // ====================================================================
      // 7. 渲染右侧报告内容
      // ====================================================================
      const reportTitleEl = document.getElementById('reportTitle');
      const reportMetaTopEl = document.getElementById('reportMetaTop');
      const reportSectionListEl = document.getElementById('reportSectionList');
      const reportArticleEl = document.getElementById('reportArticle');

      function renderReport(id) {
        const data = REPORT_DATA[id];
        if (!data) return;
        reportTitleEl.textContent = data.title;
        reportMetaTopEl.textContent = data.metaTop || '';

        // 释放旧图表实例
        disposeCharts(reportArticleEl);

        // 章节侧栏
        reportSectionListEl.innerHTML = (data.sections || []).map((s, i) => (
          '<div class="section-link' + (i === 0 ? ' active' : '') + '" data-target="' + s.id + '">' + escapeHTML(s.name) + '</div>'
        )).join('');

        // 正文：标题 + 副信息 + 章节内容
        reportArticleEl.innerHTML =
          '<h1>' + escapeHTML(data.title) + '</h1>' +
          '<p class="report-meta">生成时间：' + escapeHTML(data.generatedAt || '') + ' · 报告类型：' + escapeHTML(data.type || '') + '</p>' +
          (data.body || '');

        // 渲染所有图表占位
        requestAnimationFrame(() => renderCharts(reportArticleEl));

        // 滚动回顶
        const scrollWrap = document.querySelector('.report-content-wrap');
        if (scrollWrap) scrollWrap.scrollTop = 0;
      }

      // ====================================================================
      // 7.x ECharts 图表渲染
      // ====================================================================
      function disposeCharts(scope) {
        if (typeof echarts === 'undefined') return;
        scope.querySelectorAll('.chart-canvas').forEach((dom) => {
          const inst = echarts.getInstanceByDom(dom);
          if (inst) inst.dispose();
        });
      }

      function renderCharts(scope) {
        if (typeof echarts === 'undefined') return;
        scope.querySelectorAll('.asset-preview[data-chart]').forEach((wrap) => {
          const type = wrap.getAttribute('data-chart');
          const title = wrap.getAttribute('data-chart-title') || '';
          const dom = wrap.querySelector('.chart-canvas');
          if (!dom) return;
          const inst = echarts.init(dom);
          inst.setOption(buildChartOption(type, title));
        });
      }

      window.addEventListener('resize', function () {
        if (typeof echarts === 'undefined') return;
        document.querySelectorAll('.chart-canvas').forEach((dom) => {
          const inst = echarts.getInstanceByDom(dom);
          if (inst) inst.resize();
        });
      });

      // ECharts option 工厂：根据 type + title 关键词，返回合理可视化
      function buildChartOption(type, title) {
        const COLOR = ['#1677ff', '#36cfc9', '#ffa940', '#ff7875', '#9254de', '#52c41a', '#13c2c2', '#fadb14'];
        const baseTextStyle = { color: '#475569', fontSize: 11 };
        const baseGrid = { left: 50, right: 24, top: 30, bottom: 28 };
        const t = title || '';

        // —— 趋势 / 折线
        if (type === 'line') {
          // 不同 title 用不同 mock 数据
          let xAxis = ['1月', '2月', '3月', '4月', '5月', '6月'];
          let series = [{ name: '销售额', type: 'line', smooth: true, data: [2180, 2360, 2510, 2890, 3120, 3248], areaStyle: { opacity: 0.18 }, lineStyle: { width: 2.5 }, symbolSize: 7 }];
          if (/新品/.test(t)) {
            xAxis = ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8'];
            series = [
              { name: '智能 Pro', type: 'line', smooth: true, data: [120, 180, 260, 350, 420, 460, 510, 540], lineStyle: { width: 2 }, symbolSize: 6 },
              { name: '家居 X', type: 'line', smooth: true, data: [80, 130, 180, 220, 260, 280, 305, 330], lineStyle: { width: 2 }, symbolSize: 6 },
              { name: '办公 S', type: 'line', smooth: true, data: [60, 90, 130, 175, 220, 260, 300, 320], lineStyle: { width: 2 }, symbolSize: 6 }
            ];
          } else if (/月度|本月|核心|KPI/.test(t)) {
            xAxis = ['1月', '2月', '3月', '4月', '5月', '6月'];
            series = [
              { name: '销售额', type: 'line', smooth: true, data: [2180, 2360, 2510, 2890, 3120, 3248], lineStyle: { width: 2.5 }, symbolSize: 7 },
              { name: '订单量', type: 'line', smooth: true, data: [11200, 12100, 13200, 15360, 16800, 17260], yAxisIndex: 1, lineStyle: { width: 2 }, symbolSize: 6 }
            ];
          }
          const yAxisArr = series.length > 1 && series.some((s) => s.yAxisIndex === 1)
            ? [
                { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
                { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: baseTextStyle }
              ]
            : { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle };
          return {
            color: COLOR,
            grid: baseGrid,
            tooltip: { trigger: 'axis' },
            legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
            xAxis: { type: 'category', data: xAxis, axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
            yAxis: yAxisArr,
            series: series
          };
        }

        // —— 柱状图（垂直）
        if (type === 'bar') {
          let xAxis = ['华东', '华南', '华北', '西南', '华中', '东北'];
          let data = [3248, 2156, 1053, 982, 896, 923];
          if (/华东.*城市|城市/.test(t)) {
            xAxis = ['上海', '杭州', '苏州', '南京', '其他'];
            data = [1668, 1205, 675, 228, 1044];
          } else if (/产品线|毛利/.test(t)) {
            xAxis = ['高端系列', '主推新品', '老品维稳', '长尾产品'];
            return {
              color: COLOR,
              grid: { left: 50, right: 24, top: 30, bottom: 28 },
              tooltip: { trigger: 'axis' },
              legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
              xAxis: { type: 'category', data: xAxis, axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
              yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
              series: [
                { name: '销售占比 %', type: 'bar', barWidth: 14, itemStyle: { borderRadius: [6, 6, 0, 0] }, data: [35, 35, 22, 8] },
                { name: '毛利贡献 %', type: 'bar', barWidth: 14, itemStyle: { borderRadius: [6, 6, 0, 0] }, data: [42.4, 36.9, 17.4, 3.3] }
              ]
            };
          } else if (/下月|专项|目标拆解/.test(t)) {
            xAxis = ['北区促销', '库存改善', '客户挽回', '新品贡献'];
            data = [260, 180, 320, 220];
          }
          return {
            color: COLOR,
            grid: baseGrid,
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: xAxis, axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
            yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
            series: [{ name: title || '数值', type: 'bar', barWidth: 18, itemStyle: { borderRadius: [6, 6, 0, 0] }, data: data }]
          };
        }

        // —— 横向条形
        if (type === 'bar-h') {
          let yAxis = ['上海伟业', '北京华信', '深圳鼎盛', '广州益丰', '杭州凯越', '成都领航', '南京晨光', '苏州博远', '武汉博通', '西安兴达'];
          let data = [320, 285, 264, 232, 218, 196, 184, 172, 158, 144];
          if (/流失原因/.test(t)) {
            yAxis = ['竞品价格优势', '产品体验问题', '售后不满意', '服务响应慢', '其他'];
            data = [35, 22, 15, 12, 16];
          }
          return {
            color: COLOR,
            grid: { left: 90, right: 30, top: 28, bottom: 24 },
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
            yAxis: { type: 'category', data: yAxis.slice().reverse(), axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
            series: [{ name: title || '数值', type: 'bar', barWidth: 12, itemStyle: { borderRadius: [0, 6, 6, 0] }, data: data.slice().reverse() }]
          };
        }

        // —— 堆叠柱
        if (type === 'stacked-bar') {
          const xAxis = ['1月', '2月', '3月', '4月', '5月', '6月'];
          if (/4 月销售额/.test(t) && /拆解|结构/.test(t)) {
            return {
              color: COLOR,
              grid: baseGrid,
              tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
              legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
              xAxis: { type: 'category', data: ['基础', '促销贡献', '新品贡献', '渠道扩张', '自然增长', '4 月合计'], axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
              yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
              series: [{ name: '增量（万）', type: 'bar', barWidth: 22, itemStyle: { borderRadius: [6, 6, 0, 0] }, data: [2510, 156, 113, 60, 51, 2890] }]
            };
          }
          return {
            color: COLOR,
            grid: baseGrid,
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
            xAxis: { type: 'category', data: xAxis, axisLine: { lineStyle: { color: '#dbe2ec' } }, axisLabel: baseTextStyle },
            yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: baseTextStyle },
            series: [
              { name: '高端系列', type: 'bar', stack: 'total', barWidth: 20, data: [820, 880, 940, 1080, 1180, 1240] },
              { name: '主推新品', type: 'bar', stack: 'total', barWidth: 20, data: [560, 620, 680, 760, 820, 868] },
              { name: '老品维稳', type: 'bar', stack: 'total', barWidth: 20, data: [800, 860, 890, 1050, 1120, 1140] }
            ]
          };
        }

        // —— 饼图
        if (type === 'pie') {
          let data = [
            { name: '线上电商', value: 38 },
            { name: '门店零售', value: 26 },
            { name: '大客户直销', value: 18 },
            { name: '经销商分销', value: 12 },
            { name: '其他', value: 6 }
          ];
          if (/客户分层/.test(t)) {
            data = [
              { name: '核心客户', value: 12 },
              { name: '重要客户', value: 18 },
              { name: '普通客户', value: 46 },
              { name: '流失客户', value: 24 }
            ];
          }
          return {
            color: COLOR,
            tooltip: { trigger: 'item', formatter: '{b}<br/>{c}% ({d}%)' },
            legend: { orient: 'vertical', left: 'right', top: 'center', icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
            series: [{
              name: title || '占比', type: 'pie', radius: ['38%', '70%'], center: ['38%', '52%'],
              avoidLabelOverlap: true, itemStyle: { borderColor: '#fff', borderWidth: 2 },
              label: { show: true, formatter: '{b}\n{d}%', fontSize: 11, color: '#475569' },
              labelLine: { length: 8, length2: 6 }, data: data
            }]
          };
        }

        // —— 漏斗图
        if (type === 'funnel') {
          return {
            color: COLOR,
            tooltip: { trigger: 'item', formatter: '{b}: {c}' },
            legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
            series: [{
              name: title || '转化',
              type: 'funnel',
              left: '12%', right: '12%', top: 30, bottom: 8,
              minSize: '20%', maxSize: '100%',
              sort: 'descending', gap: 4,
              label: { show: true, position: 'inside', color: '#fff', fontSize: 12, fontWeight: 600 },
              itemStyle: { borderColor: '#fff', borderWidth: 2 },
              data: [
                { value: 1260000, name: '访问 1,260,000' },
                { value: 231840, name: '加购 231,840 (18.4%)' },
                { value: 97605, name: '下单 97,605 (42.1%)' },
                { value: 85404, name: '支付 85,404 (87.5%)' }
              ]
            }]
          };
        }

        // —— 雷达图
        if (type === 'radar') {
          return {
            color: COLOR,
            tooltip: {},
            legend: { top: 0, right: 0, icon: 'roundRect', textStyle: baseTextStyle, itemWidth: 10, itemHeight: 6 },
            radar: {
              center: ['50%', '54%'], radius: '62%',
              indicator: [
                { name: '渠道结构', max: 100 }, { name: '客户集中度', max: 100 },
                { name: '新品贡献', max: 100 }, { name: '库存周转', max: 100 },
                { name: '增长率', max: 100 }
              ],
              name: { textStyle: { color: '#475569', fontSize: 11 } },
              splitLine: { lineStyle: { color: '#dbe2ec' } },
              axisLine: { lineStyle: { color: '#dbe2ec' } },
              splitArea: { areaStyle: { color: ['rgba(22,119,255,0.04)', 'rgba(22,119,255,0.08)'] } }
            },
            series: [{
              name: title || '区域对比', type: 'radar',
              data: [
                { name: '华东', value: [88, 92, 80, 86, 82], areaStyle: { opacity: 0.18 } },
                { name: '华南', value: [78, 70, 70, 72, 76], areaStyle: { opacity: 0.12 } },
                { name: '华北', value: [62, 58, 55, 65, 60], areaStyle: { opacity: 0.10 } },
                { name: '西南', value: [60, 55, 50, 60, 65], areaStyle: { opacity: 0.10 } }
              ]
            }]
          };
        }

        // —— 热力图
        if (type === 'heatmap') {
          const xAxis = ['销售额', '订单量', '客单价', '完成率', '毛利率', '库存周转'];
          const yAxis = /客户/.test(t) ? ['上海伟业', '北京华信', '深圳鼎盛', '广州益丰', '杭州凯越', '成都领航']
                                          : ['华东', '华南', '华北', '西南', '华中', '东北'];
          const data = [];
          for (let y = 0; y < yAxis.length; y++) {
            for (let x = 0; x < xAxis.length; x++) {
              const v = Math.round(20 + Math.abs(Math.sin((x + 1) * (y + 1.3)) * 80));
              data.push([x, y, v]);
            }
          }
          return {
            tooltip: { position: 'top' },
            grid: { left: 70, right: 30, top: 30, bottom: 56 },
            xAxis: { type: 'category', data: xAxis, splitArea: { show: true }, axisLabel: baseTextStyle, axisLine: { lineStyle: { color: '#dbe2ec' } } },
            yAxis: { type: 'category', data: yAxis, splitArea: { show: true }, axisLabel: baseTextStyle, axisLine: { lineStyle: { color: '#dbe2ec' } } },
            visualMap: { min: 0, max: 100, calculable: true, orient: 'horizontal', left: 'center', bottom: 0, inRange: { color: ['#e6f4ff', '#1677ff', '#0958d9'] }, textStyle: baseTextStyle },
            series: [{ name: title || '热力', type: 'heatmap', data: data, label: { show: true, fontSize: 10, color: '#fff' }, emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } } }]
          };
        }

        // 默认占位
        return { title: { text: title, left: 'center', top: 'middle', textStyle: { color: '#94a3b8', fontSize: 13, fontWeight: 'normal' } } };
      }

      // 章节点击锚点跳转
      reportSectionListEl.addEventListener('click', function (e) {
        const link = e.target.closest('.section-link');
        if (!link) return;
        reportSectionListEl.querySelectorAll('.section-link.active').forEach((el) => el.classList.remove('active'));
        link.classList.add('active');
        const targetId = link.dataset.target;
        const target = reportArticleEl.querySelector('#' + targetId);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });

      // 初始化
      renderTree();
      renderReport(activeReportId);

      // ====================================================================
      // 8. 顶部导出菜单
      // ====================================================================
      const exportMenu = document.getElementById('reportExportMenu');
      window.toggleReportExport = function (e) {
        e.stopPropagation();
        const btn = document.getElementById('reportExportBtn');
        const rect = btn.getBoundingClientRect();
        if (exportMenu.classList.contains('hidden')) {
          exportMenu.classList.remove('hidden');
          const w = exportMenu.offsetWidth || 168;
          let left = rect.right - w;
          if (left < 8) left = 8;
          exportMenu.style.left = left + 'px';
          exportMenu.style.top = (rect.bottom + 6) + 'px';
        } else {
          exportMenu.classList.add('hidden');
        }
      };
      window.reportExportAction = function (type) {
        exportMenu.classList.add('hidden');
        const map = { image: '图片', pdf: 'PDF', word: 'Word', excel: 'Excel' };
        showToast('已导出为 ' + (map[type] || type));
      };
      document.addEventListener('click', (e) => {
        if (!exportMenu.classList.contains('hidden') && !e.target.closest('#reportExportMenu') && !e.target.closest('#reportExportBtn')) {
          exportMenu.classList.add('hidden');
        }
      });

      // ====================================================================
      // 9. 通用对话框：prompt / confirm
      // ====================================================================
      const promptMask = document.getElementById('promptMask');
      const promptModal = document.getElementById('promptModal');
      function showPrompt(opts) {
        const o = Object.assign({
          title: '输入', subtitle: '请填写信息', label: '名称',
          value: '', okText: '确定', cancelText: '取消'
        }, opts || {});
        document.getElementById('promptTitle').textContent = o.title;
        document.getElementById('promptSubtitle').textContent = o.subtitle;
        document.getElementById('promptLabel').textContent = o.label;
        const input = document.getElementById('promptInput');
        input.value = o.value;
        const okBtn = promptModal.querySelector('.modal-foot [data-act="ok"]');
        const cancelBtn = promptModal.querySelector('.modal-foot [data-act="cancel"]');
        const closeBtn = promptModal.querySelector('.modal-head [data-act="cancel"]');
        okBtn.textContent = o.okText;
        cancelBtn.textContent = o.cancelText;
        promptMask.classList.remove('hidden');
        promptModal.classList.remove('hidden');
        setTimeout(() => { input.focus(); input.select(); }, 0);

        const cleanup = () => {
          promptMask.classList.add('hidden');
          promptModal.classList.add('hidden');
          okBtn.onclick = cancelBtn.onclick = closeBtn.onclick = promptMask.onclick = null;
          document.removeEventListener('keydown', onKey);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
          else if (e.key === 'Enter') { e.preventDefault(); const v = input.value; cleanup(); o.onConfirm && o.onConfirm(v); }
        };
        okBtn.onclick = () => { const v = input.value; cleanup(); o.onConfirm && o.onConfirm(v); };
        cancelBtn.onclick = closeBtn.onclick = promptMask.onclick = cleanup;
        document.addEventListener('keydown', onKey);
      }

      const confirmMask = document.getElementById('confirmMask');
      const confirmModal = document.getElementById('confirmModal');
      function showConfirm(opts) {
        const o = Object.assign({
          title: '删除确认', subtitle: '删除后将无法恢复。',
          message: '确定要删除该条数据吗？',
          okText: '确认删除', cancelText: '取消'
        }, opts || {});
        document.getElementById('confirmTitle').textContent = o.title;
        document.getElementById('confirmSubtitle').textContent = o.subtitle;
        document.getElementById('confirmMessage').innerHTML = o.message;
        const okBtn = confirmModal.querySelector('.modal-foot [data-act="ok"]');
        const cancelBtn = confirmModal.querySelector('.modal-foot [data-act="cancel"]');
        const closeBtn = confirmModal.querySelector('.modal-head [data-act="cancel"]');
        okBtn.textContent = o.okText;
        cancelBtn.textContent = o.cancelText;
        confirmMask.classList.remove('hidden');
        confirmModal.classList.remove('hidden');

        const cleanup = () => {
          confirmMask.classList.add('hidden');
          confirmModal.classList.add('hidden');
          okBtn.onclick = cancelBtn.onclick = closeBtn.onclick = confirmMask.onclick = null;
          document.removeEventListener('keydown', onKey);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
          else if (e.key === 'Enter') { e.preventDefault(); cleanup(); o.onConfirm && o.onConfirm(); }
        };
        okBtn.onclick = () => { cleanup(); o.onConfirm && o.onConfirm(); };
        cancelBtn.onclick = closeBtn.onclick = confirmMask.onclick = cleanup;
        document.addEventListener('keydown', onKey);
      }

      function escapeHTML(s) {
        return String(s || '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
      }
    })();
  </script>
</body>
</html>
