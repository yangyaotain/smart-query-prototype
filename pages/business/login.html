<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能问数 - 登录</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/login.css" />
</head>
<body>
  <section class="login-page">
    <div class="login-visual">
      <div class="brand-row">
        <div class="logo">数</div>
        <span>智能问数</span>
      </div>

      <div class="hero-copy">
        <div class="hero-kicker">AI Data Copilot · 业务数据洞察平台</div>
        <h1>让业务人员用自然语言洞察数据</h1>
        <p>通过智能问数、数据解读、看板沉淀与报告生成，帮助业务团队快速发现问题、分析原因、形成决策依据。</p>
        <div class="hero-tags">
          <span>自然语言问数</span>
          <span>指标自动匹配</span>
          <span>图表智能生成</span>
          <span>数据深度解读</span>
          <span>看板报告沉淀</span>
        </div>
      </div>

      <div class="ai-concept">
        <div class="concept-board">
          <div class="concept-glow"></div>
          <div class="concept-node node-1"></div>
          <div class="concept-node node-2"></div>
          <div class="concept-node node-3"></div>
          <div class="concept-node node-4"></div>
          <div class="concept-node node-5"></div>
          <div class="concept-card card-query">
            <div class="card-lines">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="concept-card card-chart">
            <div class="chart-shape"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="login-panel">
      <div class="login-card">
        <h2>欢迎登录</h2>
        <div class="subtitle">智能问数业务工作台</div>
        <div class="field">
          <label>账号</label>
          <input value="zhangsan" placeholder="请输入账号/手机号" />
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" value="123456" placeholder="请输入密码" />
        </div>
        <div class="login-tools">
          <label><input type="checkbox" checked /> 记住密码</label>
          <a href="forgot-password.html">忘记密码？</a>
        </div>
        <button id="loginBtn" class="primary-btn login-submit">登录</button>
      </div>
    </div>
  </section>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/login.js"></script>
</body>
</html>
