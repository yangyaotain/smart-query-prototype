<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图表导出中心 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu"><button class="menu-item" onclick="goTo('dashboard.html')">我的仪表盘</button></nav>
    <div class="top-actions"><button class="secondary-btn" onclick="goTo('dashboard.html')">返回</button></div>
  </header>
  <main class="business-page" style="grid-template-columns:1fr;">
    <section class="module-content">
      <div class="module-content-head"><h2>图表导出中心</h2></div>
      <div class="module-scroll">
        <div class="card-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">
          <article class="asset-card"><div class="asset-body"><h3>导出 PNG 图片</h3><p>适用于汇报文档和 IM 分享。</p><div class="asset-actions"><button class="primary-btn" onclick="goTo('dashboard.html')">立即导出</button></div></div></article>
          <article class="asset-card"><div class="asset-body"><h3>导出 Excel 明细</h3><p>包含图表对应明细数据和口径说明。</p><div class="asset-actions"><button class="primary-btn" onclick="goTo('dashboard.html')">立即导出</button></div></div></article>
          <article class="asset-card"><div class="asset-body"><h3>导出 PDF 报告页</h3><p>自动附带标题、时间和筛选条件。</p><div class="asset-actions"><button class="primary-btn" onclick="goTo('dashboard.html')">立即导出</button></div></div></article>
          <article class="asset-card"><div class="asset-body"><h3>复制嵌入链接</h3><p>用于看板和报告中嵌入同源图表。</p><div class="asset-actions"><button class="primary-btn" onclick="goTo('dashboard.html')">复制链接</button></div></div></article>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/common.js"></script>
</body>
</html>
