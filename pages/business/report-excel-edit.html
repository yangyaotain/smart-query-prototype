<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="spreadjs culture" content="zh-cn" />
  <title>编辑 Excel - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
  <link rel="stylesheet" href="../../assets/vendor/spreadjs/19.2.0/css/gc.spread.sheets.css" />
  <link rel="stylesheet" href="../../assets/vendor/spreadjs/19.2.0/css/gc.spread.sheets.designer.light.min.css" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body.excel-editor-page {
      display: flex;
      flex-direction: column;
      color: #172033;
      background: #f4f7f9;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    .excel-editor-page .topbar {
      flex: 0 0 auto;
      position: relative;
      z-index: 30;
    }

    .excel-editor-page .top-left {
      min-width: 280px;
    }

    .excel-editor-page .top-actions {
      min-width: 350px;
      justify-content: flex-end;
    }

    .excel-editor-page .top-actions button {
      white-space: nowrap;
    }

    .excel-version-badge {
      height: 30px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      color: #166534;
      background: #edf9f1;
      border: 1px solid #bfe8cc;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .excel-editor-main {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    .excel-document-head {
      min-height: 66px;
      padding: 10px 22px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #fff;
      border-bottom: 1px solid #dbe3ea;
      box-sizing: border-box;
    }

    .excel-document-identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .excel-file-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(145deg, #179b54, #08783b);
      border-radius: 8px;
      box-shadow: 0 5px 12px rgba(8, 120, 59, 0.18);
      font-size: 20px;
      font-weight: 800;
    }

    .excel-document-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .excel-document-copy strong {
      overflow: hidden;
      color: #172033;
      font-size: 14px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .excel-document-copy small,
    .excel-save-state {
      color: #64748b;
      font-size: 12px;
    }

    .excel-save-state {
      flex: 0 0 auto;
    }

    .excel-save-state.is-unsaved {
      color: #b45309;
    }

    .excel-save-state.is-saved {
      color: #168449;
    }

    .spread-designer-shell {
      min-height: 0;
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    #spreadDesignerHost {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .excel-component-state {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #526176;
      background: #f8fafc;
      font-size: 13px;
    }

    .excel-component-state.is-error {
      color: #b42318;
    }

    .excel-component-state.hidden {
      display: none;
    }

    /* SpreadJS Designer 外层只做尺寸与产品主题衔接，工具栏和工作区采用组件原生样式。 */
    #spreadDesignerHost .gc-designer-container,
    #spreadDesignerHost > div {
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 1180px) {
      .excel-editor-page .top-left {
        min-width: auto;
      }

      .excel-editor-page .top-menu {
        display: none;
      }

      .excel-editor-page .top-actions {
        min-width: auto;
      }
    }
  </style>
</head>
<body class="excel-editor-page">
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu">
      <button class="menu-item" type="button" onclick="goTo('smart-query.html')">智能问数</button>
      <button class="menu-item" type="button" onclick="goTo('dashboard.html')">我的仪表盘</button>
      <button class="menu-item" type="button" onclick="goTo('board.html')">我的看板</button>
      <button class="menu-item active" type="button" onclick="returnToReport()">我的报告</button>
    </nav>
    <div class="top-actions">
      <span class="excel-version-badge" id="excelVersionBadge">版本 V1</span>
      <button class="primary-btn" type="button" id="saveWorkbookBtn"><span>✓</span><span>保存 Excel</span></button>
      <button class="ghost-btn" type="button" onclick="returnToReport()"><span>←</span><span>返回报告</span></button>
    </div>
  </header>

  <main class="excel-editor-main">
    <section class="excel-document-head">
      <div class="excel-document-identity">
        <span class="excel-file-mark">X</span>
        <span class="excel-document-copy">
          <strong id="excelFileName">销售经营明细.xlsx</strong>
          <small id="excelDocumentMeta">单表 · Web Excel 编辑 · 保存后生成新版本</small>
        </span>
      </div>
      <span class="excel-save-state" id="excelSaveState">正在加载 Excel 编辑器</span>
    </section>

    <section class="spread-designer-shell">
      <div id="spreadDesignerHost" aria-label="Excel 在线编辑器"></div>
      <div class="excel-component-state" id="excelComponentState">正在加载 Excel 编辑器…</div>
    </section>
  </main>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.all.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.resources.zh.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.charts.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.shapes.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.print.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.io.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.designer.resource.cn.min.js"></script>
  <script src="../../assets/vendor/spreadjs/19.2.0/js/gc.spread.sheets.designer.all.min.js"></script>
  <script src="../../assets/js/report-excel-data.js"></script>
  <script src="../../assets/js/report-excel-spread.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get('report') || 'r10';
      const reportId = window.ReportExcelData.has(requestedId) ? requestedId : 'r10';
      const savedMeta = window.ReportExcelData.getSavedMeta(reportId);
      let currentVersion = Math.max(Number(params.get('version')) || 1, savedMeta ? savedMeta.version : 1);
      let workbook = window.ReportExcelData.get(reportId);
      let designer = null;
      let spread = null;
      let dirty = false;
      let initializing = true;

      const versionBadge = document.getElementById('excelVersionBadge');
      const saveState = document.getElementById('excelSaveState');
      const componentState = document.getElementById('excelComponentState');
      const saveButton = document.getElementById('saveWorkbookBtn');

      function notify(message) {
        if (typeof showToast === 'function') showToast(message);
      }

      function setLoadError(message) {
        componentState.textContent = message;
        componentState.classList.add('is-error');
        saveState.textContent = 'Excel 编辑器加载失败';
        saveButton.disabled = true;
      }

      function markDirty() {
        if (initializing) return;
        dirty = true;
        saveState.textContent = '内容已修改，等待保存';
        saveState.classList.add('is-unsaved');
        saveState.classList.remove('is-saved');
      }

      function cloneConfig(value) {
        if (Array.isArray(value)) return value.map(cloneConfig);
        if (!value || typeof value !== 'object') return value;
        const output = {};
        Object.keys(value).forEach((key) => { output[key] = cloneConfig(value[key]); });
        return output;
      }

      function stripCommands(value, blocked) {
        if (Array.isArray(value)) {
          return value.map((item) => stripCommands(item, blocked)).filter((item) => item !== null && item !== undefined);
        }
        if (typeof value === 'string') return blocked.has(value) ? null : value;
        if (!value || typeof value !== 'object') return value;
        const output = {};
        Object.keys(value).forEach((key) => {
          const next = stripCommands(value[key], blocked);
          if (next !== null && next !== undefined) output[key] = next;
        });
        return output;
      }

      function buildDesignerConfig() {
        const DesignerNS = GC.Spread.Sheets.Designer;
        const names = DesignerNS.CommandNames;
        const blocked = new Set([
          names.Open,
          names.Save,
          names.InsertSheet,
          names.InsertSheetInRibbon,
          names.DeleteSheet,
          names.HideSheet,
          names.UnhideSheet
        ].filter(Boolean));
        const config = stripCommands(cloneConfig(DesignerNS.DefaultConfig), blocked);
        delete config.fileMenu;
        return config;
      }

      function enforceSingleSheet() {
        if (!spread) return;
        window.ReportExcelSpread.applySingleSheetOptions(spread);
      }

      async function initializeEditor() {
        if (!window.ReportExcelSpread || !window.ReportExcelSpread.isAvailable() || !window.GC.Spread.Sheets.Designer) {
          setLoadError('Excel 编辑器资源加载失败，请刷新页面重试');
          return;
        }

        try {
          GC.Spread.Common.CultureManager.culture('zh-cn');
          designer = new GC.Spread.Sheets.Designer.Designer(
            document.getElementById('spreadDesignerHost'),
            buildDesignerConfig(),
            null,
            {
              sheetCount: 1,
              tabStripVisible: false,
              newTabVisible: false,
              tabEditable: false,
              allowSheetReorder: false,
              allowUndo: true,
              allowContextMenu: true
            }
          );
          spread = designer.getWorkbook();
          await window.ReportExcelSpread.load(spread, workbook);
          enforceSingleSheet();

          spread.bind(GC.Spread.Sheets.Events.SheetChanged, markDirty);
          spread.bind(GC.Spread.Sheets.Events.CellChanged, markDirty);
          spread.bind(GC.Spread.Sheets.Events.RowHeightChanged, markDirty);
          spread.bind(GC.Spread.Sheets.Events.ColumnWidthChanged, markDirty);
          designer.bind(GC.Spread.Sheets.Designer.Events.FileLoaded, function () {
            enforceSingleSheet();
            markDirty();
          });

          initializing = false;
          dirty = false;
          componentState.classList.add('hidden');
          saveState.textContent = savedMeta ? '已加载最新保存版本' : '已加载示例数据';
          versionBadge.textContent = '版本 V' + currentVersion;
          document.getElementById('excelFileName').textContent = workbook.fileName;
          document.getElementById('excelDocumentMeta').textContent = workbook.title + ' · 单表 Web Excel 编辑 · 保存后生成新版本';
          requestAnimationFrame(() => designer.refresh());
        } catch (error) {
          console.error(error);
          setLoadError('Excel 编辑器初始化失败，请刷新页面重试');
        }
      }

      saveButton.addEventListener('click', function () {
        if (!spread || !window.ReportExcelSpread) return;
        enforceSingleSheet();
        workbook = window.ReportExcelSpread.serialize(spread, workbook);
        currentVersion += 1;
        window.ReportExcelData.save(reportId, workbook, currentVersion);
        dirty = false;
        versionBadge.textContent = '版本 V' + currentVersion;
        saveState.textContent = '已保存为版本 V' + currentVersion;
        saveState.classList.remove('is-unsaved');
        saveState.classList.add('is-saved');
        notify('Excel 已保存，并生成版本 V' + currentVersion);
      });

      window.returnToReport = function () {
        window.location.href = 'report.html?report=' + encodeURIComponent(reportId);
      };

      window.addEventListener('resize', function () {
        if (designer) designer.refresh();
      });

      window.addEventListener('beforeunload', function (event) {
        if (!dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });

      initializeEditor();
    })();
  </script>
</body>
</html>
