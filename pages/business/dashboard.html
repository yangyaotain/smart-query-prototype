<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的仪表盘 - 智能问数</title>

</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu">
      <button class="menu-item" onclick="goTo('smart-query.html')">智能问数</button>
      <button class="menu-item active">我的仪表盘</button>
      <button class="menu-item" onclick="goTo('board.html')">我的看板</button>
      <button class="menu-item" onclick="goTo('report.html')">我的报告</button>
      <button class="menu-item" onclick="goTo('scheduled-tasks.html')">定时任务</button>
    </nav>
    <div class="top-actions">
      <a class="requirements-link icon-btn" href="requirements.html" target="_blank" rel="noopener noreferrer" aria-label="新窗口打开需求说明"><span class="btn-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"></path><path d="M15 3v4h4"></path><path d="M9 12h6"></path><path d="M9 16h6"></path></svg></span><span>需求说明</span></a>

    </div>

  <main class="business-page">
    <aside class="module-sidebar">
      <div class="module-side-head">
        <div class="side-head-row">
          <h3>图表目录</h3>
          <span class="info-tip" data-tip="右键节点可新增/重命名/删除；按住目录可拖拽调整层级与位置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"></path>
              <circle cx="12" cy="16.5" r="0.6" fill="currentColor"></circle>
            </svg>

        <input class="search-box" id="treeSearch" style="margin-top:12px;" placeholder="搜索目录" />
      </div>
      <div class="tree-list dir-tree" id="dirTree"></div>

      <!-- 右键菜单 -->
      <div class="context-menu hidden" id="treeContextMenu">
        <button data-action="add-child"><span class="ctx-icon">＋</span>新增子目录</button>
        <button data-action="add-sibling"><span class="ctx-icon">↳</span>新增同级目录</button>
        <button data-action="rename"><span class="ctx-icon">✎</span>重命名</button>
        <button data-action="delete" class="danger"><span class="ctx-icon">🗑</span>删除</button>

    <section class="module-content" id="dashboardModule">
      <div class="module-content-head">
        <div>
          <h2>我的仪表盘</h2>
          <p style="margin:6px 0 0;color:#6b7280;font-size:13px;">来源智能问数，沉淀个人常用图表资产，数据实时展示。</p>
        </div>
        <div class="toolbar dash-toolbar">
          <button class="danger-btn icon-btn hidden" id="btnBatchDelete"><span class="btn-icon">🗑</span>批量删除 <span class="num-badge" id="batchCount">0</span></button>
          <div class="view-switcher" id="viewSwitcher">
            <button class="view-btn active" data-view="tile" title="平铺视图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button class="view-btn" data-view="table" title="表格视图">

      <div class="dash-query-bar">
        <label for="dashNameQuery">名称</label>

        <button type="button" class="ghost-btn" id="btnDashReset"><span aria-hidden="true">↺</span>重置</button>
      </div>
      <div class="module-scroll">
        <!-- 平铺视图 -->
        <div class="dash-tile-wrap" id="tileView">
        <div class="dash-tile-grid" id="tileGrid"></div>
        <div class="dash-table-foot tile-foot">
          <div class="foot-info">总共 <strong id="tileTotal">12</strong> 条数据</div>
          <div class="foot-pager">
            <button class="page-btn" disabled>‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn" disabled>›</button>

        </div>

        <!-- 表格视图 -->

                <th class="col-check"><label class="cb"><input type="checkbox" id="checkAll" /><span class="cb-box"></span></label></th>

          </table>

            <div class="foot-info">总共 <strong id="rowTotal">12</strong> 条数据</div>

  <!-- 仪表盘资产预览抽屉（单个图表或单个表格） -->
  <div class="drawer-mask hidden" id="previewMask"></div>
  <aside class="drawer preview-drawer hidden" id="previewDrawer">
    <div class="drawer-head">
      <div>
        <h3 id="previewTitle">仪表盘预览</h3>
        <p id="previewMeta">分析主题：销售分析 · 实时数据</p>
      </div>
      <div class="preview-drawer-actions">

        <button class="close" data-act="close">×</button>
      </div>
    </div>

    <div class="drawer-body">
      <section class="chart-card preview-chart-card" id="previewChartCard">
        <div class="chart-top">
          <h3 id="previewChartTitle">趋势图</h3>
          <span class="chart-meta" id="previewChartMeta">数据来源：销售订单表</span>
        </div>
        <div class="preview-chart-area" id="previewChartArea"></div>
      </section>

      <section class="preview-table-card hidden" id="previewTableCard">
        <div class="chart-top">
          <h3 id="previewTableTitle">明细数据</h3>

          <table id="previewTable"></table>

    </div>

    <div class="drawer-foot">
      <button class="ghost-btn" data-act="close"><span aria-hidden="true">×</span>关闭</button>
    </div>

  <!-- 删除确认弹窗（与智能问数历史记录删除同款） -->
  <div class="modal-mask hidden" id="confirmMask"></div>
  <section class="modal small hidden" id="confirmModal">
    <div class="modal-head">
      <div>
        <h3 id="confirmTitle">删除确认</h3>
        <p id="confirmSubtitle">删除后将无法恢复。</p>
      </div>
      <button class="close" data-act="cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="ai-tip" id="confirmMessage">确定要删除该条数据吗？</div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" data-act="cancel">取消</button>
      <button class="primary-btn" data-act="ok">确认删除</button>

  <script src="../../assets/js/echarts.min.js"></script>
  <script src="../../assets/js/dashboard-assets.js?v=20261118"></script>
  <script src="../../assets/js/common.js?v=20261110-keyword-highlight"></script>
  <script>
    (function () {
      const tree = document.getElementById('dirTree');
      const ctxMenu = document.getElementById('treeContextMenu');
      const searchInput = document.getElementById('treeSearch');
      let currentNode = null;
      let dragNode = null;

      // ---- 仪表盘示例数据（来源：智能问数常用问题与指标）----
      let DASHBOARDS = DashboardAssets.list();

      const DASH_STATE = {
        keyword: '',
        directoryId: '',
      };

      const ICON_PREVIEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
      const ICON_DELETE  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

      const LINE_PATHS = [
        'M2,40 L14,32 L26,36 L38,22 L50,28 L62,18 L74,24 L86,12 L98,16',
        'M2,34 L14,28 L26,30 L38,18 L50,24 L62,12 L74,20 L86,8  L98,14',
        'M2,42 L14,36 L26,28 L38,32 L50,20 L62,26 L74,14 L86,18 L98,10',
      ];

      function buildBars() {
        const heights = ['52%','38%','64%','46%','72%','40%','58%','68%'];
        const offset = Math.floor(Math.random() * heights.length);
        const list = heights.slice(offset).concat(heights.slice(0, offset));
        return '<div class="dash-thumb"><div class="asset-bars">'
          + list.map((h) => '<span style="height:' + h + '"></span>').join('')
          + '</div></div>';
      }

      function buildLine() {
        const theme = window.getSmartQueryThemeColors();
        const path = LINE_PATHS[Math.floor(Math.random() * LINE_PATHS.length)];
        const gid = 'lf' + Math.random().toString(36).slice(2, 8);
        return '<div class="dash-thumb line-thumb">'
          + '<svg viewBox="0 0 100 50" preserveAspectRatio="none">'
          + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0%" stop-color="' + theme.primary + '" stop-opacity="0.32"/>'
          + '<stop offset="100%" stop-color="' + theme.primary + '" stop-opacity="0"/></linearGradient></defs>'
          + '<path d="' + path + ' L98,50 L2,50 Z" fill="url(#' + gid + ')"/>'
          + '<path d="' + path + '" fill="none" stroke="' + theme.primary + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
          + '</svg></div>';
      }

      function buildPie() {
        return '<div class="dash-thumb pie-thumb"><div class="pie-ring"></div></div>';
      }

      function buildTable() {
        return '<div class="dash-thumb table-thumb"><div class="thumb-row head"></div>'
          + '<div class="thumb-row"></div><div class="thumb-row"></div><div class="thumb-row"></div>'
          + '<div class="thumb-row"></div><div class="thumb-row"></div><div class="thumb-row"></div></div>';
      }

      function thumbHTML(type) {
        if (type === 'line')  return buildLine();
        if (type === 'pie')   return buildPie();
        if (type === 'table') return buildTable();
        return buildBars();
      }

      // 预览和看板读取同一份图表资产，不包含手动更新流程。
      const previewMask = document.getElementById('previewMask');
      const previewDrawer = document.getElementById('previewDrawer');
      let previewChart = null;
      let previewRequest = 0;
      function openPreview(item) {
        const request = ++previewRequest;
        item = DashboardAssets.get(item.id);
        if (!item) return;
        if (previewChart) { previewChart.dispose(); previewChart = null; }
        document.getElementById('previewTitle').textContent = item.name + ' · 预览';
        document.getElementById('previewMeta').textContent = '分析主题：' + item.subject + ' · ' + DashboardAssets.meta(item);
        document.getElementById('previewChartTitle').textContent = item.name;
        document.getElementById('previewTableTitle').textContent = item.name;
        document.getElementById('previewChartMeta').textContent = item.unit ? '单位：' + item.unit : '';
        document.getElementById('previewTableMeta').textContent = item.period ? '统计周期：' + item.period : '';
        const isTable = item.thumb === 'table';
        document.getElementById('previewChartCard').classList.toggle('hidden', isTable);
        document.getElementById('previewTableCard').classList.toggle('hidden', !isTable);
        if (isTable) document.getElementById('previewTable').innerHTML = DashboardAssets.tableHTML(item).replace(/^<div[^>]*><table>|<\/table><\/div>$/g, '');
        previewMask.classList.remove('hidden');
        previewDrawer.classList.remove('hidden');
        previewDrawer.classList.add('open');
        if (!isTable) requestAnimationFrame(() => {
          if (request !== previewRequest || previewDrawer.classList.contains('hidden')) return;
          previewChart = echarts.init(document.getElementById('previewChartArea'));
          previewChart.setOption(DashboardAssets.option(item), true);
          previewChart.resize();
        });
      }
      window.addEventListener('resize', () => previewChart?.resize());

      function closePreview() {
        previewRequest += 1;
        previewMask.classList.add('hidden');
        previewDrawer.classList.add('hidden');
        previewDrawer.classList.remove('open');
        if (previewChart) { previewChart.dispose(); previewChart = null; }
      }

      previewMask.addEventListener('click', closePreview);
      previewDrawer.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-act="close"]');
        if (btn) closePreview();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !previewDrawer.classList.contains('hidden')) closePreview();
      });

      function getVisibleDashboards() {
        const kw = DASH_STATE.keyword.trim().toLowerCase();
        DASHBOARDS = DashboardAssets.list();
        return DASHBOARDS.filter((d) => {
          if (!DashboardAssets.inDirectory(d, DASH_STATE.directoryId)) return false;
          return !kw || d.name.toLowerCase().includes(kw);
        });
      }

      function renderTiles(list) {
        const grid = document.getElementById('tileGrid');
        const data = list || getVisibleDashboards();
        if (!data.length) {
          grid.innerHTML = '<div class="dash-empty">暂无匹配的仪表盘</div>';
          document.getElementById('tileTotal').textContent = '0';
          return;
        }
        grid.innerHTML = data.map((d) => (
          '<article class="dash-card" data-id="' + d.id + '" data-name="' + DashboardAssets.escapeHTML(d.name) + '">' +
            thumbHTML(d.thumb) +
            '<div class="dash-overlay">' +
              '<button class="overlay-btn primary"><span class="overlay-ic">' + ICON_PREVIEW + '</span>预览</button>' +
              '<button class="overlay-btn danger"><span class="overlay-ic">' + ICON_DELETE + '</span>删除</button>' +
            '</div>' +
            '<div class="dash-name">' + keywordHighlight.html(d.name, DASH_STATE.keyword) + '</div>' +
          '</article>'
        )).join('');
        document.getElementById('tileTotal').textContent = grid.children.length;
      }

      function renderTable(list) {
        const body = document.getElementById('dashTableBody');
        const data = list || getVisibleDashboards();
        if (!data.length) {
          body.innerHTML = '<tr class="dash-empty-row"><td colspan="5">暂无匹配的仪表盘</td></tr>';
          document.getElementById('rowTotal').textContent = '0';
          return;
        }
        body.innerHTML = data.map((d) => (
          '<tr data-id="' + d.id + '">' +
            '<td class="col-check"><label class="cb"><input type="checkbox" class="row-check" /><span class="cb-box"></span></label></td>' +
            '<td class="cell-name">' + keywordHighlight.html(d.name, DASH_STATE.keyword) + '</td>' +
            '<td>' + DashboardAssets.escapeHTML(d.modifier) + '</td>' +
            '<td>' + DashboardAssets.escapeHTML(d.time) + '</td>' +
            '<td class="col-actions">' +
              '<button class="row-icon" title="预览">' + ICON_PREVIEW + '<span>预览</span></button>' +
              '<button class="row-icon danger" title="删除">' + ICON_DELETE + '<span>删除</span></button>' +
            '</td>' +
          '</tr>'
        )).join('');
        document.getElementById('rowTotal').textContent = body.children.length;
      }

      function renderAssetDirectories() {
        const esc = DashboardAssets.escapeHTML;
        function walk(nodes, level) {
          return nodes.map((node) => {
            const children = node.children || [];
            const count = DashboardAssets.list().filter((asset) => DashboardAssets.inDirectory(asset, node.id)).length;
            return '<div class="tree-node ' + (children.length ? 'expanded' : 'leaf') + '" data-id="' + esc(node.id) + '" data-level="' + level + '" draggable="true"><div class="tree-row"><span class="tree-toggle' + (children.length ? '' : ' empty') + '">' + (children.length ? '▾' : '') + '</span><span class="tree-icon"></span><span class="tree-label">' + esc(node.name) + '</span><span class="tree-count">' + count + '</span></div>' + (children.length ? '<div class="tree-children">' + walk(children, level + 1) + '</div>' : '') + '</div>';
          }).join('');
        }
        tree.innerHTML = walk(DashboardAssets.directories(), 1);
      }
      function persistAssetDirectories() {
        const walk = (parent) => Array.from(parent.children).filter((node) => node.classList.contains('tree-node')).map((node) => ({ id: node.dataset.id, name: node.querySelector(':scope > .tree-row > .tree-label').textContent.trim(), children: node.querySelector(':scope > .tree-children') ? walk(node.querySelector(':scope > .tree-children')) : [] }));
        DashboardAssets.setDirectories(walk(tree));
        if (!DashboardAssets.flatten().some((node) => node.id === DASH_STATE.directoryId)) DASH_STATE.directoryId = '';
        renderDashboards();
      }
      function renderDashboards() {
        const list = getVisibleDashboards();
        renderTiles(list);
        renderTable(list);
        tree.querySelectorAll('.tree-node').forEach((node) => {
          const count = node.querySelector(':scope > .tree-row > .tree-count');
          if (count) count.textContent = DashboardAssets.list().filter((asset) => DashboardAssets.inDirectory(asset, node.dataset.id)).length;
        });
      }

      renderAssetDirectories();
      renderDashboards();

      // ---- info-tip 顶层 tooltip（避免被侧栏 overflow 截断） ----
      (function setupTip() {
        const tips = document.querySelectorAll('.info-tip');
        let pop = null;
        function show(el) {
          const text = el.dataset.tip || '';
          if (!text) return;
          pop = document.createElement('div');
          pop.className = 'info-tip-popover';
          pop.textContent = text;
          document.body.appendChild(pop);
          const rect = el.getBoundingClientRect();
          let left = rect.left - 8;
          const top = rect.bottom + 10;
          requestAnimationFrame(() => {
            const pw = pop.offsetWidth;
            if (left + pw + 8 > window.innerWidth) left = window.innerWidth - pw - 8;
            if (left < 8) left = 8;
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.classList.add('visible');
          });
        }
        function hide() {
          if (pop) { pop.remove(); pop = null; }
        }
        tips.forEach((el) => {
          el.addEventListener('mouseenter', () => show(el));
          el.addEventListener('mouseleave', hide);
          el.addEventListener('focus', () => show(el));
          el.addEventListener('blur', hide);
        });
        window.addEventListener('scroll', hide, true);
      })();

      // ---- 0. 通用：删除确认弹窗（同智能问数历史记录删除）+ 行内编辑 ----
      const confirmMask = document.getElementById('confirmMask');
      const confirmModal = document.getElementById('confirmModal');
      function showConfirm(opts) {
        const o = Object.assign({
          title: '删除确认',
          subtitle: '删除后将无法恢复。',
          message: '确定要删除该条数据吗？',
          okText: '确认删除',
          cancelText: '取消',
        }, opts || {});
        document.getElementById('confirmTitle').textContent = o.title;
        document.getElementById('confirmSubtitle').textContent = o.subtitle;
        document.getElementById('confirmMessage').innerHTML = o.message;

        const okBtn = confirmModal.querySelector('.modal-foot [data-act="ok"]');
        const cancelBtn = confirmModal.querySelector('.modal-foot [data-act="cancel"]');
        const closeBtn = confirmModal.querySelector('.modal-head [data-act="cancel"]');
        okBtn.textContent = o.okText;
        cancelBtn.textContent = o.cancelText;

        confirmMask.classList.remove('hidden');
        confirmModal.classList.remove('hidden');

        const cleanup = () => {
          confirmMask.classList.add('hidden');
          confirmModal.classList.add('hidden');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
          closeBtn.onclick = null;
          confirmMask.onclick = null;
          document.removeEventListener('keydown', onKey);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
          else if (e.key === 'Enter') { e.preventDefault(); cleanup(); o.onConfirm && o.onConfirm(); }
        };
        okBtn.onclick = () => { cleanup(); o.onConfirm && o.onConfirm(); };
        cancelBtn.onclick = cleanup;
        closeBtn.onclick = cleanup;
        confirmMask.onclick = cleanup;
        document.addEventListener('keydown', onKey);
      }

      function enterEdit(labelEl, initial, onCommit) {
        const original = labelEl.textContent;
        const input = document.createElement('input');
        input.className = 'tree-edit-input';
        input.value = initial;
        input.maxLength = 30;
        labelEl.textContent = '';
        labelEl.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);

        let finished = false;
        const finish = (commit) => {
          if (finished) return;
          finished = true;
          const v = input.value.trim();
          const next = (commit && v) ? v : original;
          if (input.parentElement) input.parentElement.removeChild(input);
          labelEl.textContent = next;
          if (onCommit) onCommit(next, commit && !!v);
          if (searchInput.value.trim()) applyTreeSearch();
        };
        input.addEventListener('blur', () => finish(true));
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); finish(true); }
          else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        input.addEventListener('click', (e) => e.stopPropagation());
      }

      // ---- 1. 展开 / 收起 + 选中 ----
      tree.addEventListener('click', function (e) {
        if (e.target.closest('.tree-edit-input')) return;
        const toggle = e.target.closest('.tree-toggle');
        const row = e.target.closest('.tree-row');
        if (!row) return;
        const node = row.parentElement;

        if (toggle && !toggle.classList.contains('empty')) {
          e.stopPropagation();
          if (node.classList.contains('expanded')) {
            node.classList.remove('expanded');
            node.classList.add('collapsed');
            toggle.textContent = '▸';
          } else {
            node.classList.remove('collapsed');
            node.classList.add('expanded');
            toggle.textContent = '▾';
          }
          return;
        }

        tree.querySelectorAll('.tree-row.active').forEach((el) => el.classList.remove('active'));
        row.classList.add('active');
        DASH_STATE.directoryId = node.dataset.id;
        applyDashboardQuery();
      });

      // ---- 2. 右键菜单 ----
      tree.addEventListener('contextmenu', function (e) {
        const row = e.target.closest('.tree-row');
        if (!row) return;
        e.preventDefault();
        currentNode = row.parentElement;

        tree.querySelectorAll('.tree-row.context-active').forEach((el) => el.classList.remove('context-active'));
        row.classList.add('context-active');

        const level = parseInt(currentNode.dataset.level, 10);
        const addChildBtn = ctxMenu.querySelector('[data-action="add-child"]');
        addChildBtn.disabled = level >= 3;
        addChildBtn.classList.toggle('disabled', level >= 3);

        ctxMenu.classList.remove('hidden');
        const menuW = ctxMenu.offsetWidth || 180;
        const menuH = ctxMenu.offsetHeight || 200;
        const x = Math.min(e.clientX, window.innerWidth - menuW - 8);
        const y = Math.min(e.clientY, window.innerHeight - menuH - 8);
        ctxMenu.style.left = x + 'px';
        ctxMenu.style.top = y + 'px';
      });

      document.addEventListener('click', function () {
        ctxMenu.classList.add('hidden');
        tree.querySelectorAll('.tree-row.context-active').forEach((el) => el.classList.remove('context-active'));
      });

      ctxMenu.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        e.stopPropagation();
        const action = btn.dataset.action;
        ctxMenu.classList.add('hidden');
        if (!currentNode) return;

        if (action === 'add-child') addChildNode(currentNode);
        else if (action === 'add-sibling') addSiblingNode(currentNode);
        else if (action === 'rename') renameNode(currentNode);
        else if (action === 'delete') deleteNode(currentNode);
      });

      function makeNode(label, level) {
        const node = document.createElement('div');
        node.className = 'tree-node leaf new-flash';
        node.dataset.id = 'new-' + Date.now();
        node.dataset.level = String(level);
        node.draggable = true;
        node.innerHTML =
          '<div class="tree-row">' +
          '<span class="tree-toggle empty"></span>' +
          '<span class="tree-icon"></span>' +
          '<span class="tree-label">' + label + '</span>' +
          '<span class="tree-count">0</span>' +
          '</div>';
        return node;
      }

      function ensureChildrenContainer(parentNode) {
        let children = parentNode.querySelector(':scope > .tree-children');
        if (!children) {
          children = document.createElement('div');
          children.className = 'tree-children';
          parentNode.appendChild(children);
        }
        parentNode.classList.remove('leaf', 'collapsed');
        parentNode.classList.add('expanded');
        const toggle = parentNode.querySelector(':scope > .tree-row > .tree-toggle');
        if (toggle) {
          toggle.classList.remove('empty');
          toggle.textContent = '▾';
        }
        return children;
      }

      function addChildNode(parentNode) {
        const level = parseInt(parentNode.dataset.level, 10);
        if (level >= 3) {
          showToast('已达三级目录上限');
          return;
        }
        const children = ensureChildrenContainer(parentNode);
        const newNode = makeNode('新建目录', level + 1);
        children.appendChild(newNode);
        const labelEl = newNode.querySelector(':scope > .tree-row > .tree-label');
        enterEdit(labelEl, '新建目录', (v, ok) => {
          if (ok) { persistAssetDirectories(); showToast('已新增子目录：' + v); }
        });
      }

      function addSiblingNode(node) {
        const level = parseInt(node.dataset.level, 10);
        const newNode = makeNode('新建目录', level);
        node.parentElement.insertBefore(newNode, node.nextSibling);
        const labelEl = newNode.querySelector(':scope > .tree-row > .tree-label');
        enterEdit(labelEl, '新建目录', (v, ok) => {
          if (ok) { persistAssetDirectories(); showToast('已新增同级目录：' + v); }
        });
      }

      function renameNode(node) {
        const labelEl = node.querySelector(':scope > .tree-row > .tree-label');
        enterEdit(labelEl, labelEl.textContent, (v, ok) => {
          if (ok) { persistAssetDirectories(); showToast('已重命名为：' + v); }
        });
      }

      function deleteNode(node) {
        if (DashboardAssets.list().some((asset) => DashboardAssets.inDirectory(asset, node.dataset.id))) { showToast('该目录下存在图表或表格，请先删除资产后再删除目录'); return; }
        const labelEl = node.querySelector(':scope > .tree-row > .tree-label');
        const name = labelEl.textContent;
        const hasChild = !!node.querySelector(':scope > .tree-children > .tree-node');
        showConfirm({
          title: '删除确认',
          subtitle: hasChild ? '删除后，该目录及其下子目录将不再展示。' : '删除后，该目录将不再展示。',
          message: '确定要删除「<span style="color:#17375e;font-weight:700;">' + DashboardAssets.escapeHTML(name) + '</span>」吗？',
          onConfirm: function () {
            node.remove();
            persistAssetDirectories();
            if (searchInput.value.trim()) applyTreeSearch();
            showToast('已删除：' + name);
          },
        });
      }

      // ---- 3. 拖拽排序 / 调整层级 ----
      tree.addEventListener('dragstart', function (e) {
        const node = e.target.closest('.tree-node');
        if (!node) return;
        dragNode = node;
        node.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', node.dataset.id); } catch (err) {}
      });

      tree.addEventListener('dragend', function () {
        if (dragNode) dragNode.classList.remove('dragging');
        clearDropMarkers();
        dragNode = null;
      });

      tree.addEventListener('dragover', function (e) {
        if (!dragNode) return;
        const targetNode = e.target.closest('.tree-node');
        if (!targetNode || targetNode === dragNode) return;
        if (targetNode.contains(dragNode)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        const row = targetNode.querySelector(':scope > .tree-row');
        const rect = row.getBoundingClientRect();
        const offset = e.clientY - rect.top;
        const ratio = offset / rect.height;

        clearDropMarkers();
        const targetLevel = parseInt(targetNode.dataset.level, 10);
        const dragSubtreeDepth = getSubtreeDepth(dragNode);

        if (ratio < 0.25) {
          targetNode.classList.add('drop-before');
        } else if (ratio > 0.75) {
          targetNode.classList.add('drop-after');
        } else if (targetLevel + dragSubtreeDepth <= 3) {
          targetNode.classList.add('drop-inside');
        } else {
          targetNode.classList.add('drop-after');
        }
      });

      tree.addEventListener('dragleave', function (e) {
        const node = e.target.closest('.tree-node');
        if (node && !node.contains(e.relatedTarget)) {
          node.classList.remove('drop-before', 'drop-after', 'drop-inside');
        }
      });

      tree.addEventListener('drop', function (e) {
        if (!dragNode) return;
        const targetNode = e.target.closest('.tree-node');
        if (!targetNode || targetNode === dragNode) return;
        if (targetNode.contains(dragNode)) return;
        e.preventDefault();

        const mode = targetNode.classList.contains('drop-inside')
          ? 'inside'
          : targetNode.classList.contains('drop-before')
          ? 'before'
          : 'after';
        clearDropMarkers();

        const targetLevel = parseInt(targetNode.dataset.level, 10);
        const dragDepth = getSubtreeDepth(dragNode);

        if (mode === 'inside') {
          if (targetLevel + dragDepth > 3) {
            showToast('超出三级目录限制');
            return;
          }
          const children = ensureChildrenContainer(targetNode);
          children.appendChild(dragNode);
          updateLevels(dragNode, targetLevel + 1);
        } else {
          const parentChildren = targetNode.parentElement;
          const parentLevel = targetLevel;
          if (parentLevel + dragDepth - 1 > 3) {
            showToast('超出三级目录限制');
            return;
          }
          if (mode === 'before') {
            parentChildren.insertBefore(dragNode, targetNode);
          } else {
            parentChildren.insertBefore(dragNode, targetNode.nextSibling);
          }
          updateLevels(dragNode, parentLevel);
        }

        cleanupEmptyParents();
        persistAssetDirectories();
        if (searchInput.value.trim()) applyTreeSearch();
        showToast('已调整目录位置');
      });

      function clearDropMarkers() {
        tree.querySelectorAll('.drop-before, .drop-after, .drop-inside').forEach((el) =>
          el.classList.remove('drop-before', 'drop-after', 'drop-inside')
        );
      }

      function getSubtreeDepth(node) {
        const children = node.querySelectorAll(':scope > .tree-children > .tree-node');
        if (!children.length) return 1;
        let max = 0;
        children.forEach((c) => {
          const d = getSubtreeDepth(c);
          if (d > max) max = d;
        });
        return max + 1;
      }

      function updateLevels(node, level) {
        node.dataset.level = String(level);
        const children = node.querySelectorAll(':scope > .tree-children > .tree-node');
        children.forEach((c) => updateLevels(c, level + 1));
      }

      function cleanupEmptyParents() {
        tree.querySelectorAll('.tree-node').forEach((node) => {
          const children = node.querySelector(':scope > .tree-children');
          if (children && children.children.length === 0) {
            children.remove();
            node.classList.remove('expanded', 'collapsed');
            node.classList.add('leaf');
            const toggle = node.querySelector(':scope > .tree-row > .tree-toggle');
            if (toggle) {
              toggle.classList.add('empty');
              toggle.textContent = '';
            }
          }
        });
      }

      // ---- 4. 视图切换（平铺 / 表格） ----
      const viewSwitcher = document.getElementById('viewSwitcher');
      const tileView = document.getElementById('tileView');
      const tableView = document.getElementById('tableView');
      const dashModule = document.getElementById('dashboardModule');
      viewSwitcher.addEventListener('click', function (e) {
        const btn = e.target.closest('.view-btn');
        if (!btn) return;
        viewSwitcher.querySelectorAll('.view-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const view = btn.dataset.view;
        if (view === 'tile') {
          tileView.classList.remove('hidden');
          tableView.classList.add('hidden');
          dashModule.classList.remove('view-table-mode');
          document.getElementById('btnBatchDelete').classList.add('hidden');
        } else {
          tileView.classList.add('hidden');
          tableView.classList.remove('hidden');
          dashModule.classList.add('view-table-mode');
        }
      });

      // ---- 5. 表格多选 + 批量删除 ----
      const checkAll = document.getElementById('checkAll');
      const dashTable = document.getElementById('dashTable');
      const btnBatchDelete = document.getElementById('btnBatchDelete');
      const batchCount = document.getElementById('batchCount');
      const dashNameQuery = document.getElementById('dashNameQuery');
      const btnDashQuery = document.getElementById('btnDashQuery');
      const btnDashReset = document.getElementById('btnDashReset');

      function applyDashboardQuery() {
        DASH_STATE.keyword = dashNameQuery.value.trim();
        renderDashboards();
        refreshBatchState();
      }

      btnDashQuery.addEventListener('click', applyDashboardQuery);
      dashNameQuery.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          applyDashboardQuery();
        }
      });
      btnDashReset.addEventListener('click', function () {
        dashNameQuery.value = '';
        DASH_STATE.keyword = '';
        DASH_STATE.directoryId = '';
        tree.querySelectorAll('.tree-row.active').forEach((row) => row.classList.remove('active'));
        renderDashboards();
        refreshBatchState();
      });

      function refreshBatchState() {
        const checks = dashTable.querySelectorAll('tbody .row-check');
        const checked = dashTable.querySelectorAll('tbody .row-check:checked');
        if (checked.length > 0) {
          btnBatchDelete.classList.remove('hidden');
          batchCount.textContent = checked.length;
        } else {
          btnBatchDelete.classList.add('hidden');
        }
        if (checks.length && checked.length === checks.length) {
          checkAll.checked = true;
          checkAll.indeterminate = false;
        } else if (checked.length > 0) {
          checkAll.checked = false;
          checkAll.indeterminate = true;
        } else {
          checkAll.checked = false;
          checkAll.indeterminate = false;
        }
        dashTable.querySelectorAll('tbody tr').forEach((tr) => {
          const cb = tr.querySelector('.row-check');
          tr.classList.toggle('row-checked', cb && cb.checked);
        });
      }

      checkAll.addEventListener('change', function () {
        dashTable.querySelectorAll('tbody .row-check').forEach((cb) => (cb.checked = checkAll.checked));
        refreshBatchState();
      });

      dashTable.addEventListener('change', function (e) {
        if (e.target.classList.contains('row-check')) refreshBatchState();
      });

      dashTable.addEventListener('click', function (e) {
        const btn = e.target.closest('.row-icon');
        if (!btn) return;
        const tr = btn.closest('tr');
        const name = tr.querySelector('.cell-name').textContent.trim();
        if (btn.classList.contains('danger')) {
          showConfirm({
            title: '删除确认',
            subtitle: '删除后，该仪表盘将不再展示；已加入看板的组件继续保留。',
            message: '确定要删除「<span style="color:#17375e;font-weight:700;">' + DashboardAssets.escapeHTML(name) + '</span>」吗？',
            onConfirm: function () {
              DashboardAssets.remove([tr.dataset.id]);
              renderDashboards();
              refreshBatchState();
              showToast('已删除：' + name);
            },
          });
        } else {
          const item = DASHBOARDS.find((d) => d.id === tr.dataset.id);
          if (item) openPreview(item);
        }
      });

      btnBatchDelete.addEventListener('click', function () {
        const checked = dashTable.querySelectorAll('tbody .row-check:checked');
        if (!checked.length) return;
        showConfirm({
          title: '批量删除',
          subtitle: '删除后，选中的仪表盘将不再展示；已加入看板的组件继续保留。',
          message: '确定要批量删除选中的 <span style="color:#17375e;font-weight:700;">' + checked.length + '</span> 个仪表盘吗？',
          okText: '批量删除',
          onConfirm: function () {
            checked.forEach((cb) => {
              const tr = cb.closest('tr');
              if (tr && tr.dataset.id) DashboardAssets.remove([tr.dataset.id]);
            });
            renderDashboards();
            refreshBatchState();
            showToast('已批量删除');
          },
        });
      });

      // ---- 6. 平铺卡片预览 / 删除 ----
      document.getElementById('tileView').addEventListener('click', function (e) {
        const btn = e.target.closest('.overlay-btn');
        if (!btn) return;
        e.stopPropagation();
        const card = btn.closest('.dash-card');
        const name = card.dataset.name || card.querySelector('.dash-name').textContent.trim();
        if (btn.classList.contains('danger')) {
          showConfirm({
            title: '删除确认',
            subtitle: '删除后，该仪表盘将不再展示；已加入看板的组件继续保留。',
            message: '确定要删除「<span style="color:#17375e;font-weight:700;">' + DashboardAssets.escapeHTML(name) + '</span>」吗？',
            onConfirm: function () {
              DashboardAssets.remove([card.dataset.id]);
              renderDashboards();
              refreshBatchState();
              showToast('已删除：' + name);
            },
          });
        } else {
          const item = DASHBOARDS.find((d) => d.id === card.dataset.id);
          if (item) openPreview(item);
        }
      });

      // ---- 7. 搜索过滤 ----
      function applyTreeSearch() {
        filterKeywordTree(tree, searchInput.value);
      }

      searchInput.addEventListener('input', applyTreeSearch);
    })();
  </script>
</body>
</html>
