<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑看板 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
</head>
<body>
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu"><button class="menu-item" onclick="goTo('smart-query.html')">智能问数</button><button class="menu-item" onclick="goTo('dashboard.html')">我的仪表盘</button><button class="menu-item active">我的看板</button><button class="menu-item" onclick="goTo('report.html')">我的报告</button></nav>
    <div class="top-actions"><button class="secondary-btn" onclick="goTo('board.html')">预览</button><button class="primary-btn" onclick="goTo('board.html')">保存</button></div>
  </header>
  <main class="editor-page">
    <aside class="module-sidebar">
      <div class="module-side-head"><h3>我的仪表盘</h3><input class="search-box" style="margin-top:12px;" placeholder="搜索图表并拖入画布" /></div>
      <div class="tree-list">
        <div class="asset-card" style="margin-bottom:12px;"><div class="asset-preview" style="height:96px;"><div class="asset-line"></div></div><div class="asset-body"><h3>销售额趋势</h3><p>折线图 · 来源智能问数</p></div></div>
        <div class="asset-card" style="margin-bottom:12px;"><div class="asset-preview" style="height:96px;"><div class="asset-bars"><span style="height:60%"></span><span style="height:80%"></span><span style="height:45%"></span></div></div><div class="asset-body"><h3>渠道转化率</h3><p>柱状图 · 来源仪表盘</p></div></div>
        <div class="asset-card"><div class="asset-preview" style="height:96px;"><div class="asset-line"></div></div><div class="asset-body"><h3>目标完成率</h3><p>面积图 · 来源智能问数</p></div></div>
      </div>
    </aside>
    <section class="editor-canvas">
      <div class="board-canvas">
        <div class="canvas-widget wide"><h3>销售经营看板</h3><p style="color:#6b7280;">可拖拽图表、调整组件大小和排版布局。</p></div>
        <div class="canvas-widget"><h3>华东区销售额趋势</h3><div class="asset-preview" style="height:170px;"><div class="asset-line"></div></div></div>
        <div class="canvas-widget"><h3>渠道转化率对比</h3><div class="asset-preview" style="height:170px;"><div class="asset-bars"><span style="height:54%"></span><span style="height:82%"></span><span style="height:42%"></span></div></div></div>
        <div class="canvas-widget wide"><h3>说明文本</h3><p style="line-height:1.8;">AI 已为该看板生成区域销售表现说明，可在右侧属性面板中调整标题、尺寸、样式和刷新频率。</p></div>
      </div>
    </section>
    <aside class="property-panel">
      <div class="module-side-head"><h3>组件属性</h3></div>
      <div class="tree-list">
        <div class="field"><label>组件标题</label><input value="华东区销售额趋势" /></div>
        <div class="field"><label>组件尺寸</label><select><option>中等</option><option>大</option><option>小</option></select></div>
        <div class="field"><label>刷新频率</label><select><option>每日刷新</option><option>每小时刷新</option><option>手动刷新</option></select></div>
        <div class="field"><label>说明文字</label><textarea>近6个月华东区销售额持续增长。</textarea></div>
        <button class="primary-btn" style="width:100%;" onclick="goTo('board.html')">应用设置</button>
      </div>
    </aside>
  </main>
  <script src="../../assets/js/common.js"></script>
</body>
</html>
