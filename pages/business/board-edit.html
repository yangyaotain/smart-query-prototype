<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑看板 - 智能问数</title>
  <link rel="stylesheet" href="../../assets/css/theme.css" />
  <link rel="stylesheet" href="../../assets/css/business.css" />
  <style>
    /* ============================================================
     * 编辑看板页面（高保真重构版）
     * ============================================================ */
    .board-edit-page .editor-page {
      grid-template-columns: 296px 1fr;
      gap: 14px;
      padding: 14px;
    }

    /* —— 顶部：看板名 + 保存状态 —— */
    .board-edit-page .topbar .top-actions {
      gap: 8px;
    }

    .board-edit-page .editor-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      color: #374151;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      font-size: 13px;
      font-weight: 600;
    }

    .board-edit-page .editor-tool-btn:hover {
      color: var(--primary);
      border-color: rgba(22, 119, 255, 0.45);
      background: #f5faff;
    }

    .board-edit-page .editor-tool-btn:disabled {
      color: #c2c8d3;
      cursor: not-allowed;
      background: #f8fafc;
    }

    .board-edit-page .editor-tool-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* —— 左侧：我的仪表盘（目录树 + 图表节点） —— */
    .board-edit-page .module-sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .board-edit-page .module-sidebar .tree-list {
      flex: 1;
      min-height: 0;
      padding: 10px 8px 14px;
    }

    /* —— 目录节点：保留 business.css 默认 1/2/3 级缩进，仅补充 4/5 级 —— */
    .board-edit-page .dir-tree .tree-node[data-level="4"] > .tree-row { padding-left: 62px; }
    .board-edit-page .dir-tree .tree-node[data-level="5"] > .tree-row { padding-left: 80px; }

    /* —— 图表叶子节点：与父级 label 起点对齐，明显比父级目录更深一级 —— */
    .board-edit-page .dir-tree .tree-node[data-type="chart"][data-level="2"] > .tree-row { padding-left: 56px; }
    .board-edit-page .dir-tree .tree-node[data-type="chart"][data-level="3"] > .tree-row { padding-left: 74px; }
    .board-edit-page .dir-tree .tree-node[data-type="chart"][data-level="4"] > .tree-row { padding-left: 92px; }
    .board-edit-page .dir-tree .tree-node[data-type="chart"][data-level="5"] > .tree-row { padding-left: 110px; }

    /* 第 3、4 级 children 也需要竖线装饰 */
    .board-edit-page .dir-tree .tree-node[data-level="3"] > .tree-children::before,
    .board-edit-page .dir-tree .tree-node[data-level="4"] > .tree-children::before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: 1px;
      background: #e2e8f0;
    }
    .board-edit-page .dir-tree .tree-node[data-level="3"] > .tree-children::before { left: 52px; }
    .board-edit-page .dir-tree .tree-node[data-level="4"] > .tree-children::before { left: 70px; }

    /* 图表叶子节点：紧凑卡片风格（在 level 缩进基础上做微调） */
    .dir-tree .tree-node[data-type="chart"] > .tree-row {
      position: relative;
      gap: 8px;
      cursor: grab;
      padding-top: 6px;
      padding-bottom: 6px;
      padding-right: 8px;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row:active {
      cursor: grabbing;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row > .tree-toggle,
    .dir-tree .tree-node[data-type="chart"] > .tree-row > .tree-icon {
      display: none;
    }

    /* 图表节点 hover 时高亮缩略图边框 */
    .dir-tree .tree-node[data-type="chart"] > .tree-row:hover .chart-thumb {
      border-color: rgba(22, 119, 255, 0.55);
      box-shadow: 0 3px 8px rgba(22, 119, 255, 0.18);
    }


    /* 图表迷你缩略图（紧凑版，避免与目录文件夹图标视觉冲突） */
    .dir-tree .chart-thumb {
      flex: none;
      width: 20px;
      height: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 1px;
      padding: 2px 3px;
      border-radius: 5px;
      background: linear-gradient(135deg, #eaf3ff, #f7faff);
      border: 1px solid rgba(22, 119, 255, 0.22);
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .dir-tree .chart-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .dir-tree .chart-thumb.bars span {
      display: inline-block;
      width: 2px;
      border-radius: 1px;
      background: linear-gradient(180deg, #4ea5ff, #1677ff);
    }

    .dir-tree .chart-thumb.pie {
      align-items: center;
      padding: 1px;
    }

    .dir-tree .chart-thumb.pie .pie-mini {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: conic-gradient(#1677ff 0 32%, #4ea5ff 32% 56%, #8cc8ff 56% 78%, #cfe2ff 78% 92%, #e2eeff 92% 100%);
      box-shadow: 0 0 0 1px rgba(22, 119, 255, 0.15) inset;
    }

    .dir-tree .chart-thumb.table {
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 1.5px;
      padding: 2px 3px;
    }

    .dir-tree .chart-thumb.table i {
      display: block;
      height: 1.5px;
      border-radius: 1px;
      background: #cfdcef;
    }

    .dir-tree .chart-thumb.table i.head {
      height: 2px;
      background: linear-gradient(90deg, #1677ff, #4ea5ff);
    }

    .dir-tree .tree-node[data-type="chart"] .tree-label {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dir-tree .tree-node[data-type="chart"] .chart-add {
      flex: none;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      background: var(--primary-soft);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row:hover .chart-add {
      opacity: 1;
    }

    .dir-tree .tree-node[data-type="chart"] .chart-add:hover {
      color: #fff;
      background: var(--primary);
    }

    .dir-tree .tree-node[data-type="chart"] .chart-add svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row.in-canvas {
      background: rgba(22, 197, 94, 0.06);
      color: #16a34a;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row.in-canvas .tree-label {
      color: #15803d;
    }

    .dir-tree .tree-node[data-type="chart"] > .tree-row.in-canvas .chart-add {
      opacity: 1;
      color: #16a34a;
      background: rgba(34, 197, 94, 0.12);
      cursor: default;
    }

    /* —— 中间：编辑区 —— */
    .board-edit-page .editor-canvas-wrap {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }

    .board-edit-page .editor-canvas-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfdff, #fff);
    }

    .board-edit-page .board-name-block {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .board-edit-page .board-name-input {
      flex: 0 1 auto;
      max-width: 360px;
      height: 34px;
      padding: 0 12px;
      color: #17375e;
      font-size: 16px;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .board-edit-page .board-name-input:hover {
      border-color: var(--line);
      background: #f8fbff;
    }

    .board-edit-page .board-name-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    .board-edit-page .save-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #16a34a;
      font-size: 12px;
      font-weight: 600;
    }

    .board-edit-page .save-state::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.16);
    }

    /* —— 编辑画布外层（滚动容器） —— */
    .board-edit-page .editor-canvas {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      background: #fff;
    }

    /* —— 复用查看页 .board-canvas / .canvas-widget 视觉，仅叠加编辑能力 —— */
    .board-edit-page .editor-canvas .board-canvas {
      min-height: calc(100% - 0px);
    }

    /* 每个 widget 在编辑模式下额外具备：可拖动、可选中、可 resize */
    .board-edit-page .canvas-widget {
      position: relative;
      cursor: grab;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    .board-edit-page .canvas-widget:active {
      cursor: grabbing;
    }

    .board-edit-page .canvas-widget:hover {
      border-color: rgba(22, 119, 255, 0.55);
      box-shadow: 0 14px 30px rgba(22, 119, 255, 0.12);
    }

    .board-edit-page .canvas-widget.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.18), 0 14px 30px rgba(22, 119, 255, 0.18);
    }

    .board-edit-page .canvas-widget.dragging {
      opacity: 0.55;
      transform: scale(0.985);
    }

    .board-edit-page .canvas-widget.drop-target::before {
      content: "";
      position: absolute;
      left: -3px;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 2px;
      background: var(--primary);
      z-index: 2;
    }

    /* widget 标题：可点击进入编辑 */
    .board-edit-page .canvas-widget > h3 {
      cursor: text;
    }

    .board-edit-page .canvas-widget > h3 .widget-title {
      flex: 1;
      min-width: 0;
      padding: 2px 6px;
      margin: -2px -6px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .board-edit-page .canvas-widget > h3 .widget-title:hover {
      background: rgba(22, 119, 255, 0.06);
    }

    .board-edit-page .canvas-widget > h3 .widget-title.editing {
      display: none;
    }

    .board-edit-page .canvas-widget .widget-title-input {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 10px;
      color: #17375e;
      font-size: 14px;
      font-weight: 700;
      background: #fff;
      border: 1px solid var(--primary);
      border-radius: 8px;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
      outline: none;
      font-family: inherit;
    }

    /* 右上角浮动操作（删除按钮） */
    .board-edit-page .canvas-widget .widget-actions {
      position: absolute;
      top: 10px;
      right: 12px;
      display: flex;
      gap: 4px;
      opacity: 0;
      z-index: 4;
      transition: opacity 0.15s ease;
    }

    .board-edit-page .canvas-widget:hover .widget-actions,
    .board-edit-page .canvas-widget.selected .widget-actions {
      opacity: 1;
    }

    .board-edit-page .canvas-widget .widget-actions button {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .board-edit-page .canvas-widget .widget-actions button:hover {
      color: var(--primary);
      background: #fff;
      border-color: rgba(22, 119, 255, 0.5);
    }

    .board-edit-page .canvas-widget .widget-actions button.danger:hover {
      color: #dc2626;
      border-color: rgba(220, 38, 38, 0.5);
      background: #fff5f5;
    }

    .board-edit-page .canvas-widget .widget-actions button svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* —— Resize handles 叠在 .canvas-widget 边缘 —— */
    .board-edit-page .canvas-widget .resize-handle {
      position: absolute;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .board-edit-page .canvas-widget:hover .resize-handle,
    .board-edit-page .canvas-widget.selected .resize-handle {
      opacity: 1;
    }

    .board-edit-page .canvas-widget .resize-handle.resize-e {
      top: 14px;
      bottom: 14px;
      right: -3px;
      width: 6px;
      cursor: ew-resize;
      border-radius: 4px;
    }

    .board-edit-page .canvas-widget .resize-handle.resize-s {
      left: 14px;
      right: 14px;
      bottom: -3px;
      height: 6px;
      cursor: ns-resize;
      border-radius: 4px;
    }

    .board-edit-page .canvas-widget .resize-handle.resize-e:hover,
    .board-edit-page .canvas-widget .resize-handle.resize-s:hover,
    .board-edit-page .canvas-widget.resizing .resize-handle {
      background: rgba(22, 119, 255, 0.32);
    }

    .board-edit-page .canvas-widget .resize-handle.resize-se {
      right: 0;
      bottom: 0;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      background:
        linear-gradient(135deg, transparent 50%, rgba(22, 119, 255, 0.55) 50%, rgba(22, 119, 255, 0.55) 60%, transparent 60%, transparent 70%, rgba(22, 119, 255, 0.55) 70%, rgba(22, 119, 255, 0.55) 80%, transparent 80%, transparent 90%, rgba(22, 119, 255, 0.55) 90%);
      border-bottom-right-radius: 14px;
    }

    .board-edit-page .canvas-widget .resize-handle.resize-se:hover {
      background:
        linear-gradient(135deg, transparent 50%, var(--primary) 50%, var(--primary) 60%, transparent 60%, transparent 70%, var(--primary) 70%, var(--primary) 80%, transparent 80%, transparent 90%, var(--primary) 90%);
    }

    .board-edit-page .canvas-widget.resizing {
      transition: none;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.32), 0 18px 38px rgba(22, 119, 255, 0.18) !important;
      cursor: ew-resize;
    }

    .board-edit-page .canvas-widget.resizing .widget-chart,
    .board-edit-page .canvas-widget.resizing .kpi-grid {
      pointer-events: none;
    }

    /* resize 时的尺寸提示气泡 */
    .board-edit-page .resize-tip {
      position: fixed;
      pointer-events: none;
      padding: 4px 9px;
      color: #fff;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.18);
    }

    /* 空态 */
    .board-edit-page .canvas-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 320px;
      padding: 32px;
      color: #94a3b8;
      background: #fff;
      border: 1.5px dashed #cbd5e1;
      border-radius: 16px;
    }

    .board-edit-page .canvas-empty .empty-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 50%;
    }

    .board-edit-page .canvas-empty .empty-icon svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .board-edit-page .canvas-empty h4 {
      margin: 0;
      color: #17375e;
      font-size: 15px;
    }

    .board-edit-page .canvas-empty p {
      margin: 0;
      font-size: 13px;
    }

    /* 拖入图表时高亮整块画布外框 */
    .board-edit-page .editor-canvas.drag-over .board-canvas {
      outline: 2px dashed rgba(22, 119, 255, 0.55);
      outline-offset: 4px;
      background: #eef6ff;
    }

    /* —— 树节点 hover 高亮目录的图表数 —— */
    .dir-tree .tree-node[data-type="folder"] > .tree-row .tree-count {
      padding: 0 7px;
      height: 16px;
      line-height: 16px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    /* 拖入提示 */
    .board-edit-page .drag-ghost {
      position: fixed;
      top: -200px;
      left: -200px;
      pointer-events: none;
      padding: 6px 10px;
      color: #fff;
      background: var(--primary);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 12px 24px rgba(22, 119, 255, 0.32);
      z-index: 9999;
    }
  </style>
</head>
<body class="board-edit-page board-page">
  <header class="topbar">
    <div class="top-left"><div class="logo">数</div><div class="product-name">智能问数</div></div>
    <nav class="top-menu">
      <button class="menu-item" onclick="goTo('smart-query.html')">智能问数</button>
      <button class="menu-item" onclick="goTo('dashboard.html')">我的仪表盘</button>
      <button class="menu-item active">我的看板</button>
      <button class="menu-item" onclick="goTo('report.html')">我的报告</button>
    </nav>
    <div class="top-actions">
      <button class="primary-btn" id="btnSave">保存看板</button>
      <button class="ghost-btn" onclick="goTo('board.html')">退出</button>
    </div>
  </header>

  <main class="editor-page">
    <!-- ==================== 左侧：我的仪表盘（目录树） ==================== -->
    <aside class="module-sidebar">
      <div class="module-side-head">
        <div class="side-head-row">
          <h3>我的仪表盘</h3>
          <span class="info-tip" data-tip="目录来自我的仪表盘 · 图表目录；最末级为具体图表，可拖拽或点击 + 加入画布">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"></path>
              <circle cx="12" cy="16.5" r="0.6" fill="currentColor"></circle>
            </svg>
          </span>
        </div>
        <input class="search-box" id="treeSearch" style="margin-top:12px;" placeholder="搜索目录 / 图表" />
      </div>
      <div class="tree-list dir-tree" id="dirTree"></div>
    </aside>

    <!-- ==================== 中间：编辑画布 ==================== -->
    <section class="editor-canvas-wrap">
      <div class="editor-canvas-head">
        <div class="board-name-block">
          <input id="boardNameInput" class="board-name-input" type="text" value="销售经营总览" maxlength="40" />
          <span class="save-state" id="saveState">已自动保存 · 09:32</span>
        </div>
      </div>
      <div class="editor-canvas" id="editorCanvas">
        <div class="board-canvas" id="canvas"></div>
      </div>
    </section>

  </main>

  <!-- 删除确认弹窗 -->
  <div class="modal-mask hidden" id="confirmMask"></div>
  <section class="modal small hidden" id="confirmModal">
    <div class="modal-head">
      <div>
        <h3 id="confirmTitle">删除组件</h3>
        <p id="confirmSubtitle">删除后可通过左侧再次添加。</p>
      </div>
      <button class="close" data-act="cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="ai-tip" id="confirmMessage">确定要删除该组件吗？</div>
    </div>
    <div class="modal-foot">
      <button class="ghost-btn" data-act="cancel">取消</button>
      <button class="primary-btn" data-act="ok">确认删除</button>
    </div>
  </section>

  <script src="../../assets/js/echarts.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script>
    /* eslint-disable */
    (function () {
      // ====================================================================
      // 1. 数据：图表清单（来自我的仪表盘 dashboard.html）
      // ====================================================================
      const DASHBOARDS = {

      function buildLineMini() {
        const path = LINE_PATHS[0];

        const heights = [55, 38, 64, 45, 72, 40];

      function thumbInner(type) {
        if (type === 'line')  return buildLineMini();
        if (type === 'bars')  return buildBarsMini();

        if (type === 'table') return buildTableMini();
        return '';
      }

      // 计算节点下图表总数
      function countCharts(node) {
        let n = 0;
        if (node.charts && node.charts.length) n += node.charts.length;
        if (node.children && node.children.length) {
          node.children.forEach((c) => n += countCharts(c));
        }
        return n;
      }

      function renderTree() {
        tree.innerHTML = DIR_TREE.map((root) => buildFolderHTML(root, 1, true)).join('');
      }

      function buildFolderHTML(node, level, expanded) {
        const total = countCharts(node);
        const hasChildren = (node.children && node.children.length) || (node.charts && node.charts.length);
        const stateCls = hasChildren ? (expanded ? 'expanded' : 'collapsed') : 'leaf';
        const toggleIcon = hasChildren ? (expanded ? '▾' : '▸') : '';
        const toggleCls = hasChildren ? '' : ' empty';

        let inner = '';
        if (node.children && node.children.length) {
          inner += node.children.map((c) => buildFolderHTML(c, level + 1, level < 2)).join('');
        }
        if (node.charts && node.charts.length) {
          inner += node.charts.map((id) => buildChartHTML(DASHBOARDS[id], level + 1)).join('');
        }

        return (
          '<div class="tree-node ' + stateCls + '" data-id="' + node.id + '" data-level="' + level + '" data-type="folder">' +
            '<div class="tree-row">' +
              '<span class="tree-toggle' + toggleCls + '">' + toggleIcon + '</span>' +
              '<span class="tree-icon"></span>' +
              '<span class="tree-label">' + node.name + '</span>' +
              '<span class="tree-count">' + total + '</span>' +
            '</div>' +
            (inner ? '<div class="tree-children">' + inner + '</div>' : '') +
          '</div>'
        );
      }

          if (node) {
            addChartToCanvas(node.dataset.id);
          }
          return;
        }

        const toggle = e.target.closest('.tree-toggle');
        const row = e.target.closest('.tree-row');
        if (!row) return;
        const node = row.parentElement;

        if (toggle && !toggle.classList.contains('empty')) {
          e.stopPropagation();
          toggleFolder(node);
          return;
        }

        if (node.dataset.type === 'folder') {
          toggleFolder(node);
        } else if (node.dataset.type === 'chart') {
          tree.querySelectorAll('.tree-row.active').forEach((el) => el.classList.remove('active'));
          row.classList.add('active');
        }
      });

      function toggleFolder(node) {
        const toggle = node.querySelector(':scope > .tree-row > .tree-toggle');
        if (node.classList.contains('expanded')) {
          node.classList.remove('expanded');
          node.classList.add('collapsed');
          if (toggle && !toggle.classList.contains('empty')) toggle.textContent = '▸';
        } else {
          node.classList.remove('collapsed');
          node.classList.add('expanded');
          if (toggle && !toggle.classList.contains('empty')) toggle.textContent = '▾';
        }
      }

      // info-tip 顶层 popover（与其他页一致）
      (function setupTip() {
        const tips = document.querySelectorAll('.info-tip');
        let pop = null;
        function show(el) {
          const text = el.dataset.tip || '';
          if (!text) return;
          pop = document.createElement('div');
          pop.className = 'info-tip-popover';
          pop.textContent = text;
          document.body.appendChild(pop);
          const rect = el.getBoundingClientRect();
          let left = rect.left - 8;
          const top = rect.bottom + 10;
          requestAnimationFrame(() => {
            const pw = pop.offsetWidth;
            if (left + pw + 8 > window.innerWidth) left = window.innerWidth - pw - 8;
            if (left < 8) left = 8;
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.classList.add('visible');
          });
        }
        function hide() { if (pop) { pop.remove(); pop = null; } }
        tips.forEach((el) => {
          el.addEventListener('mouseenter', () => show(el));
          el.addEventListener('mouseleave', hide);
        });
        window.addEventListener('scroll', hide, true);
      })();

        tree.querySelectorAll('.tree-node').forEach((node) => {
          const label = node.querySelector(':scope > .tree-row > .tree-label').textContent.toLowerCase();
          if (label.includes(kw)) {
            matchSet.add(node);
            let p = node.parentElement;
            while (p && p !== tree) {
              if (p.classList.contains('tree-node')) {
                matchSet.add(p);
                p.classList.remove('collapsed');

            }

              lineStyle: { width: 3, color: '#1677ff' },
              itemStyle: { color: '#1677ff', borderColor: '#fff', borderWidth: 2 },
              areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(22,119,255,0.32)' }, { offset: 1, color: 'rgba(22,119,255,0)' }] } },
              data: realPart
            },
            {
              name: '预测', type: 'line', smooth: true, symbol: 'circle', symbolSize: 8,
              lineStyle: { width: 3, color: '#f59e0b', type: 'dashed' },
              itemStyle: { color: '#f59e0b', borderColor: '#fff', borderWidth: 2 },
              data: forecastPart
            }
          ]
        };
      }

      function buildRegionOption(data) {
        return {
          grid: { top: 24, left: 56, right: 24, bottom: 28 },
          tooltip: { trigger: 'axis', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 } },
          xAxis: { type: 'category', data: data.names, axisTick: { show: false }, axisLine: { lineStyle: { color: '#dbe5f7' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          series: [{
            type: 'bar', barWidth: 20,
            itemStyle: {
              borderRadius: [10, 10, 4, 4],
              color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#4ea5ff' }, { offset: 1, color: '#cfe4ff' }] }
            },
            emphasis: { itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#1677ff' }, { offset: 1, color: '#8cc8ff' }] } } },
            data: data.values
          }]
        };
      }

      function buildChannelOption(data) {
        const palette = ['#1677ff', '#4ea5ff', '#8cc8ff', '#cfe2ff', '#fbbf24', '#f59e0b'];
        return {
          color: palette,
          tooltip: { trigger: 'item', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 }, formatter: '{b}<br/>占比：{d}%' },
          legend: { orient: 'vertical', right: 8, top: 'middle', icon: 'circle', itemGap: 10, itemWidth: 8, itemHeight: 8, textStyle: { color: '#3b4a64', fontSize: 11 } },
          series: [{
            type: 'pie', radius: ['44%', '70%'], center: ['36%', '52%'], avoidLabelOverlap: true,
            itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 },
            label: { show: false },
            labelLine: { show: false },
            emphasis: { scale: true, scaleSize: 6, itemStyle: { shadowBlur: 14, shadowOffsetY: 4, shadowColor: 'rgba(22,119,255,0.32)' } },
            data: data
          }]
        };
      }

      function buildGaugeOption(value) {
        return {
          series: [{
            type: 'gauge', startAngle: 210, endAngle: -30, min: 0, max: 100,
            radius: '92%', center: ['50%', '60%'],
            progress: { show: true, width: 14, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#4ea5ff' }, { offset: 1, color: '#1677ff' }] } } },
            axisLine: { lineStyle: { width: 14, color: [[1, '#eef2f7']] } },
            pointer: { show: false },
            axisTick: { show: false },
            splitLine: { show: false },
            axisLabel: { distance: -22, color: '#94a3b8', fontSize: 10 },
            anchor: { show: false },
            title: { show: true, offsetCenter: [0, '32%'], color: '#94a3b8', fontSize: 11 },
            detail: { valueAnimation: true, offsetCenter: [0, '0%'], formatter: '{value}%', color: '#17375e', fontSize: 26, fontWeight: 700 },
            data: [{ value: value, name: '完成率' }]
          }]
        };
      }

      function buildTopCustomerOption(data) {
        const len = data.names.length;
        const names = data.names.slice().reverse();
        const values = data.values.slice().reverse();
        return {
          grid: { top: 12, left: 8, right: 56, bottom: 8, containLabel: true },
          tooltip: { trigger: 'axis', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 }, axisPointer: { type: 'shadow' } },
          xAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
          yAxis: { type: 'category', data: names, axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#374151', fontSize: 11 } },
          series: [{
            type: 'bar', barWidth: 12,
            itemStyle: {
              borderRadius: [4, 8, 8, 4],
              color: function (p) {
                const ratio = (p.dataIndex + 1) / len;
                return { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#cfe4ff' }, { offset: 1, color: ratio > 0.6 ? '#1677ff' : '#4ea5ff' }] };
              }
            },
            label: { show: true, position: 'right', color: '#1f3f7a', fontSize: 11, fontWeight: 600 },
            data: values
          }]
        };
      }

      function buildProductMixOption(data) {
        const palette = ['#1677ff', '#4ea5ff', '#cfe2ff'];
        const series = data.series.map((s, i) => ({
          name: s.name, type: 'bar', stack: 'total', barWidth: 26,
          itemStyle: { color: palette[i % palette.length], borderRadius: i === data.series.length - 1 ? [8, 8, 0, 0] : 0 },
          emphasis: { focus: 'series' },
          data: s.values
        }));
        return {
          grid: { top: 36, left: 56, right: 24, bottom: 32 },
          tooltip: { trigger: 'axis', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 }, axisPointer: { type: 'shadow' } },
          legend: { right: 12, top: 4, icon: 'circle', itemWidth: 8, itemHeight: 8, textStyle: { color: '#3b4a64', fontSize: 11 } },
          xAxis: { type: 'category', data: data.months, axisTick: { show: false }, axisLine: { lineStyle: { color: '#dbe5f7' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          series: series
        };
      }

      // 渠道占比的简易（用于左侧拖入 thumb=pie 的图表）
      function buildSimplePieOption(legendNames) {
        const palette = ['#1677ff', '#4ea5ff', '#8cc8ff', '#cfe2ff', '#fbbf24'];
        const data = (legendNames || ['类别A','类别B','类别C','类别D']).map((n, i) => ({ name: n, value: 30 - i * 5 + 10 }));
        return {
          color: palette,
          tooltip: { trigger: 'item', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 } },
          legend: { orient: 'vertical', right: 8, top: 'middle', icon: 'circle', itemGap: 10, itemWidth: 8, itemHeight: 8, textStyle: { color: '#3b4a64', fontSize: 11 } },
          series: [{ type: 'pie', radius: ['44%', '70%'], center: ['36%', '52%'], itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 }, label: { show: false }, data: data }]
        };
      }

      function buildSimpleLineOption() {
        return {
          grid: { top: 28, left: 48, right: 24, bottom: 28 },
          tooltip: { trigger: 'axis', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 } },
          xAxis: { type: 'category', data: ['1月','2月','3月','4月','5月','6月'], axisTick: { show: false }, axisLine: { lineStyle: { color: '#dbe5f7' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          series: [{
            type: 'line', smooth: true, symbol: 'circle', symbolSize: 8, showSymbol: true,
            lineStyle: { width: 3, color: '#1677ff' },
            itemStyle: { color: '#1677ff', borderColor: '#fff', borderWidth: 2 },
            areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(22,119,255,0.32)' }, { offset: 1, color: 'rgba(22,119,255,0)' }] } },
            data: [82, 96, 108, 124, 142, 158]
          }]
        };
      }

      function buildSimpleBarOption() {
        return {
          grid: { top: 24, left: 48, right: 24, bottom: 28 },
          tooltip: { trigger: 'axis', backgroundColor: 'rgba(17,24,39,0.92)', borderWidth: 0, textStyle: { color: '#fff', fontSize: 12 } },
          xAxis: { type: 'category', data: ['类别A','类别B','类别C','类别D','类别E'], axisTick: { show: false }, axisLine: { lineStyle: { color: '#dbe5f7' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#eef2f7', type: 'dashed' } }, axisLabel: { color: '#7e8aa3', fontSize: 11 } },
          series: [{
            type: 'bar', barWidth: 22,
            itemStyle: { borderRadius: [10, 10, 4, 4], color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#4ea5ff' }, { offset: 1, color: '#cfe4ff' }] } },
            data: [62, 88, 75, 54, 96]
          }]
        };
      }

      // 根据 item 决定 ECharts option
      function buildOptionForItem(item) {
        switch (item.chartType) {
          case 'trend':      return buildTrendOption(item.data);
          case 'region':     return buildRegionOption(item.data);
          case 'channel':    return buildChannelOption(item.data);
          case 'gauge':      return buildGaugeOption(item.data);
          case 'topcus':     return buildTopCustomerOption(item.data);
          case 'productMix': return buildProductMixOption(item.data);
          case 'line':       return buildSimpleLineOption();
          case 'bars':       return buildSimpleBarOption();
          case 'pie':        return buildSimplePieOption();
          default:           return null;
        }
      }

      function renderAllCharts() {
        canvasItems.forEach((item) => {
          if (item.kind !== 'chart') return;
          const inst = ensureChart('chart-' + item.uid);
          if (!inst) return;
          const option = buildOptionForItem(item);
          if (!option) {
            // 不支持的图表类型 → 显示简易占位
            const dom = document.getElementById('chart-' + item.uid);
            if (dom) dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:12px;">[' + escapeHTML(item.title || '图表') + ']</div>';
            return;
          }
          inst.setOption(option, true);
          requestAnimationFrame(() => { try { inst.resize(); } catch (e) {} });
        });
      }

      // 单个 widget 的 ECharts resize（resize handle 拖动后调用）
      function resizeChartFor(uid) {
        const item = canvasItems.find((x) => x.uid === uid);
        if (!item || item.kind !== 'chart') return;
        const dom = document.getElementById('chart-' + uid);
        if (!dom || typeof echarts === 'undefined') return;
        const inst = echarts.getInstanceByDom(dom);
        if (inst) try { inst.resize(); } catch (e) {}
      }

      // 监听窗口尺寸变化，自动 resize 所有图表
      window.addEventListener('resize', function () {
        if (typeof echarts === 'undefined') return;
        canvasItems.forEach((item) => {
          if (item.kind !== 'chart') return;
          const dom = document.getElementById('chart-' + item.uid);
          if (!dom) return;
          const inst = echarts.getInstanceByDom(dom);
          if (inst) try { inst.resize(); } catch (e) {}
        });
      });

      // ====================================================================
      // 7. 画布交互：选中 / 删除 / 标题就地编辑 / 拖拽换位
      // ====================================================================
      canvas.addEventListener('click', function (e) {
        // 删除按钮
        const actionBtn = e.target.closest('.widget-actions button');
        const widget = e.target.closest('.canvas-widget');
        if (!widget) {
          selectWidget(null);
          return;
        }
        if (actionBtn) {
          e.stopPropagation();
          const act = actionBtn.dataset.act;
          if (act === 'delete') confirmDeleteWidget(widget.dataset.uid);
          return;
        }
        // 点标题进入就地编辑
        const titleEl = e.target.closest('.widget-title');
        if (titleEl && !titleEl.classList.contains('editing')) {
          e.stopPropagation();
          startTitleEdit(widget.dataset.uid);
          return;
        }
        selectWidget(widget.dataset.uid);
      });

      function selectWidget(uid) {
        selectedUid = uid;
        canvas.querySelectorAll('.canvas-widget.selected').forEach((el) => el.classList.remove('selected'));
        if (uid) {
          const el = canvas.querySelector('[data-uid="' + uid + '"]');
          if (el) el.classList.add('selected');
        }
      }

      // —— 标题就地编辑：点击 .widget-title → 输入框；失焦或回车保存 ——
      function startTitleEdit(uid) {
        const item = canvasItems.find((x) => x.uid === uid);
        if (!item) return;
        const widgetEl = canvas.querySelector('[data-uid="' + uid + '"]');
        if (!widgetEl) return;
        const head = widgetEl.querySelector(':scope > h3');
        if (!head) return;
        const titleEl = head.querySelector('.widget-title');
        if (!titleEl || head.querySelector('.widget-title-input')) return;

        const oldDraggable = widgetEl.getAttribute('draggable');
        widgetEl.setAttribute('draggable', 'false');

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'widget-title-input';
        input.value = item.title || '';
        input.maxLength = 40;
        titleEl.classList.add('editing');
        titleEl.parentNode.insertBefore(input, titleEl);
        setTimeout(() => { input.focus(); input.select(); }, 0);

        let finished = false;
        const finish = (commit) => {
          if (finished) return;
          finished = true;
          if (commit) {
            const v = input.value.trim();
            if (v && v !== item.title) {
              snapshot();
              item.title = v;
              showToast('已更新组件标题');
            }
          }
          if (input.parentNode) input.parentNode.removeChild(input);
          titleEl.classList.remove('editing');
          titleEl.textContent = item.title || '未命名组件';
          if (oldDraggable !== null) widgetEl.setAttribute('draggable', oldDraggable);
          else widgetEl.removeAttribute('draggable');
        };
        input.addEventListener('blur', () => finish(true));
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); finish(true); }
          else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        });
        input.addEventListener('click', (e) => e.stopPropagation());
        input.addEventListener('mousedown', (e) => e.stopPropagation());
      }

      function confirmDeleteWidget(uid) {
        const it = canvasItems.find((x) => x.uid === uid);
        if (!it) return;
        showConfirm({
          title: '删除组件',
          subtitle: '删除后可通过左侧重新加入。',
          message: '确定要从画布移除「<span style="color:#17375e;font-weight:700;">' + (it.title || '组件') + '</span>」吗？',
          onConfirm: function () {
            snapshot();
            // 销毁对应 ECharts 实例
            if (typeof echarts !== 'undefined') {
              const dom = document.getElementById('chart-' + uid);
              if (dom) {
                const inst = echarts.getInstanceByDom(dom);
                if (inst) inst.dispose();
              }
            }
            canvasItems = canvasItems.filter((x) => x.uid !== uid);
            if (selectedUid === uid) selectedUid = null;
            renderCanvas();
            showToast('已移除组件');
          }
        });
      }

      // 画布内部 widget 拖拽换位
      let internalDrag = null;
      canvas.addEventListener('dragstart', function (e) {
        const w = e.target.closest('.canvas-widget');
        if (!w) return;
        internalDrag = w.dataset.uid;
        w.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('application/x-widget', w.dataset.uid); } catch (err) {}
      });
      canvas.addEventListener('dragend', function () {
        canvas.querySelectorAll('.canvas-widget.dragging').forEach((el) => el.classList.remove('dragging'));
        canvas.querySelectorAll('.canvas-widget.drop-target').forEach((el) => el.classList.remove('drop-target'));
        internalDrag = null;
      });
      canvas.addEventListener('dragover', function (e) {
        if (!internalDrag) return;
        const target = e.target.closest('.canvas-widget');
        if (!target || target.dataset.uid === internalDrag) return;
        e.preventDefault();
        canvas.querySelectorAll('.canvas-widget.drop-target').forEach((el) => el.classList.remove('drop-target'));
        target.classList.add('drop-target');
      });
      canvas.addEventListener('drop', function (e) {
        if (!internalDrag) return;
        const target = e.target.closest('.canvas-widget');
        if (!target || target.dataset.uid === internalDrag) return;
        e.preventDefault();
        const fromIdx = canvasItems.findIndex((x) => x.uid === internalDrag);
        const toIdx = canvasItems.findIndex((x) => x.uid === target.dataset.uid);
        if (fromIdx < 0 || toIdx < 0) return;
        snapshot();
        const [item] = canvasItems.splice(fromIdx, 1);
        canvasItems.splice(toIdx, 0, item);
        renderCanvas();
        showToast('已调整组件顺序');
      });

      // ====================================================================
      // 7.5 拖拽边缘调整 widget 大小（右 / 下 / 右下）
      // ====================================================================
      let resizeCtx = null;

      canvas.addEventListener('mousedown', function (e) {
        const handle = e.target.closest('.resize-handle');
        if (!handle) return;
        const widgetEl = handle.closest('.canvas-widget');
        if (!widgetEl) return;
        e.preventDefault();
        e.stopPropagation();

        const dir = handle.dataset.resize;
        const item = canvasItems.find((x) => x.uid === widgetEl.dataset.uid);
        if (!item) return;

        const rect = widgetEl.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        // .board-canvas 默认 2 列（与查看页保持一致）
        const gridCols = 2;
        const gap = 14;
        const colWidth = (canvasRect.width - gap * (gridCols - 1) - 32) / gridCols;

        widgetEl.setAttribute('draggable', 'false');

        resizeCtx = {
          widgetEl, item, dir,
          startX: e.clientX, startY: e.clientY,
          startWidth: rect.width, startHeight: rect.height,
          colWidth, gap, gridCols
        };

        widgetEl.classList.add('resizing');
        document.body.style.cursor =
          dir === 's' ? 'ns-resize' : (dir === 'e' ? 'ew-resize' : 'nwse-resize');
        document.body.style.userSelect = 'none';

        const tip = document.createElement('div');
        tip.className = 'resize-tip';
        document.body.appendChild(tip);
        resizeCtx.tip = tip;
        updateResizeTip();

        resizeCtx.origSpan = item.span;
        resizeCtx.origHeight = item.height;
      });

      function updateResizeTip() {
        if (!resizeCtx || !resizeCtx.tip) return;
        const r = resizeCtx.widgetEl.getBoundingClientRect();
        const spanLabel = resizeCtx.widgetEl.classList.contains('wide') ? '占满' : '1 列';
        resizeCtx.tip.textContent = spanLabel + ' · ' + Math.round(r.height) + 'px';
        const left = Math.min(window.innerWidth - 100, r.right + 8);
        const top = Math.min(window.innerHeight - 30, r.bottom - 24);
        resizeCtx.tip.style.left = left + 'px';
        resizeCtx.tip.style.top = top + 'px';
      }

      document.addEventListener('mousemove', function (e) {
        if (!resizeCtx) return;
        const { widgetEl, dir, startX, startY, startWidth, startHeight, colWidth, gap } = resizeCtx;

        if (dir === 'e' || dir === 'se') {
          const newWidth = startWidth + (e.clientX - startX);
          // 2 列布局：吸附 1 列 / 占满
          if (newWidth < (colWidth + gap) * 1.5) {
            widgetEl.classList.remove('wide');
          } else {
            widgetEl.classList.add('wide');
          }
        }

        if (dir === 's' || dir === 'se') {
          let newHeight = startHeight + (e.clientY - startY);
          newHeight = Math.max(160, Math.min(800, newHeight));
          widgetEl.style.height = newHeight + 'px';
        }

        updateResizeTip();
      });

      document.addEventListener('mouseup', function () {
        if (!resizeCtx) return;
        const { widgetEl, item, dir } = resizeCtx;

        if (dir === 'e' || dir === 'se') {
          item.span = widgetEl.classList.contains('wide') ? 'wide' : 'normal';
        }
        if (dir === 's' || dir === 'se') {
          item.height = parseInt(widgetEl.style.height, 10) || widgetEl.offsetHeight;
        }

        const changed = (item.span !== resizeCtx.origSpan) || (item.height !== resizeCtx.origHeight);
        if (changed) snapshot();

        widgetEl.classList.remove('resizing');
        widgetEl.setAttribute('draggable', 'true');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';

        if (resizeCtx.tip && resizeCtx.tip.parentNode) {
          resizeCtx.tip.parentNode.removeChild(resizeCtx.tip);
        }
        const finishedItem = item;
        resizeCtx = null;
        if (changed) {
          showToast('已调整组件大小');
          // ECharts 容器尺寸变化后必须 resize
          resizeChartFor(finishedItem.uid);
        }
      });

      // ESC 取消 resize
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape' || !resizeCtx) return;
        const { widgetEl } = resizeCtx;
        widgetEl.classList.remove('wide');
        if (resizeCtx.origSpan === 'wide') widgetEl.classList.add('wide');
        if (resizeCtx.origHeight) widgetEl.style.height = resizeCtx.origHeight + 'px';
        else widgetEl.style.height = '';
        widgetEl.classList.remove('resizing');
        widgetEl.setAttribute('draggable', 'true');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (resizeCtx.tip && resizeCtx.tip.parentNode) {
          resizeCtx.tip.parentNode.removeChild(resizeCtx.tip);
        }
        resizeCtx = null;
        showToast('已取消尺寸调整');
      });

      // ====================================================================
      // 8. 从树拖拽图表 → 画布
      // ====================================================================
      tree.addEventListener('dragstart', function (e) {
        const node = e.target.closest('.tree-node[data-type="chart"]');
        if (!node) return;
        try {
          e.dataTransfer.setData('application/x-chart', node.dataset.id);
          e.dataTransfer.effectAllowed = 'copy';
        } catch (err) {}
      });

      editorCanvas.addEventListener('dragover', function (e) {
        const types = e.dataTransfer && e.dataTransfer.types;
        if (types && Array.prototype.indexOf.call(types, 'application/x-chart') !== -1) {
          e.preventDefault();
          editorCanvas.classList.add('drag-over');
        }
      });
      editorCanvas.addEventListener('dragleave', function (e) {
        if (e.target === editorCanvas) editorCanvas.classList.remove('drag-over');
      });
      editorCanvas.addEventListener('drop', function (e) {
        let id = '';
        try { id = e.dataTransfer.getData('application/x-chart'); } catch (err) {}
        editorCanvas.classList.remove('drag-over');
        if (!id) return;
        e.preventDefault();
        addChartToCanvas(id);
      });

      function addChartToCanvas(chartId) {
        const chart = DASHBOARDS[chartId];
        if (!chart) return;
        if (canvasItems.some((it) => it.kind === 'chart' && it.chartId === chartId)) {
          showToast('该图表已在画布中');
          return;
        }
        snapshot();
        // 按 thumb 类型映射到内置 chartType（line/bars/pie 用简易 ECharts；table 暂不渲染）
        const typeMap = { line: 'line', bars: 'bars', pie: 'pie', table: 'table' };
        const item = {
          uid: 'w-' + Date.now(),
          kind: 'chart',
          chartId: chartId,
          chartType: typeMap[chart.thumb] || 'line',
          span: 'normal',
          title: chart.name,
          desc: chart.summary || ''
        };
        canvasItems.push(item);
        selectedUid = item.uid;
        renderCanvas();
        showToast('已加入：' + chart.name);
      }

      // ====================================================================
      // 9. 顶部工具：保存按钮 + 看板名状态反馈
      //    （内部仍保留 snapshot 栈，供其他变更调用，不暴露 UI）
      // ====================================================================
      const undoStack = [];
      function snapshot() {
        undoStack.push(JSON.stringify({ items: canvasItems, sel: selectedUid }));
        if (undoStack.length > 50) undoStack.shift();
      }

      const saveBtn = document.getElementById('btnSave');
      const saveState = document.getElementById('saveState');
      saveBtn.addEventListener('click', function () {
        const name = document.getElementById('boardNameInput').value.trim() || '未命名看板';
        showToast('已保存看板:' + name);
        const t = new Date();
        const hh = String(t.getHours()).padStart(2, '0');
        const mm = String(t.getMinutes()).padStart(2, '0');
        saveState.textContent = '已保存 · ' + hh + ':' + mm;
        saveState.style.color = '';
        setTimeout(() => goTo('board.html'), 600);
      });

      // 看板名实时反馈"编辑中"
      document.getElementById('boardNameInput').addEventListener('input', function () {
        saveState.textContent = '编辑中 · 待保存';
        saveState.style.color = '#f59e0b';
      });

      function escapeHTML(s) {
        return String(s || '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
      }

      // ====================================================================
      // 11. 删除确认弹窗（与其他页一致）
      // ====================================================================
      const confirmMask = document.getElementById('confirmMask');
      const confirmModal = document.getElementById('confirmModal');
      function showConfirm(opts) {
        const o = Object.assign({
          title: '删除确认', subtitle: '删除后将无法恢复。',
          message: '确定要删除该条数据吗？',
          okText: '确认删除', cancelText: '取消'
        }, opts || {});
        document.getElementById('confirmTitle').textContent = o.title;
        document.getElementById('confirmSubtitle').textContent = o.subtitle;
        document.getElementById('confirmMessage').innerHTML = o.message;

        const okBtn = confirmModal.querySelector('.modal-foot [data-act="ok"]');
        const cancelBtn = confirmModal.querySelector('.modal-foot [data-act="cancel"]');
        const closeBtn = confirmModal.querySelector('.modal-head [data-act="cancel"]');
        okBtn.textContent = o.okText;
        cancelBtn.textContent = o.cancelText;

        confirmMask.classList.remove('hidden');
        confirmModal.classList.remove('hidden');

        const cleanup = () => {
          confirmMask.classList.add('hidden');
          confirmModal.classList.add('hidden');
          okBtn.onclick = null;
          cancelBtn.onclick = null;
          closeBtn.onclick = null;
          confirmMask.onclick = null;
          document.removeEventListener('keydown', onKey);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); cleanup(); }
          else if (e.key === 'Enter') { e.preventDefault(); cleanup(); o.onConfirm && o.onConfirm(); }
        };
        okBtn.onclick = () => { cleanup(); o.onConfirm && o.onConfirm(); };
        cancelBtn.onclick = cleanup;
        closeBtn.onclick = cleanup;
        confirmMask.onclick = cleanup;
        document.addEventListener('keydown', onKey);
      }

      // editorCanvas dragleave 修复：拖出整个外框时才取消高亮
      editorCanvas.addEventListener('dragleave', function (e) {
        if (!editorCanvas.contains(e.relatedTarget)) {
          editorCanvas.classList.remove('drag-over');
        }
      });

      // ====================================================================
      // 12. 初始化
      // ====================================================================
      renderCanvas();
    })();
  </script>
</body>
</html>
